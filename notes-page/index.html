<!doctype html>
<html lang="en" dir="ltr" data-palette="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232a2924'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%235f7f62'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="top">
  <div class="logo"><i aria-hidden="true"></i>Halo</div>
  <nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav>
  <div class="sp"></div>
  <div class="seg glass" role="group" aria-label="Interface language">
    <button data-lang="en">EN</button><button data-lang="ar" lang="ar">عربي</button>
  </div>
  <button class="btn glass" id="export" hidden></button>
</header>
<div class="keybar" id="keybar" role="alert" data-t="nokey" hidden></div>
<main id="view"></main>
<div class="toast glass" id="toast" role="status"></div>
<script src="./app.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var meetingId = params.get("meeting");
  window.HaloNotes.boot(document, meetingId);
})();
</script>
</body>
</html>
