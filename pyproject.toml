[project]
name = "halo"
version = "0.1.0"
description = "Halo: bilingual Arabic/English Google Meet copilot (local backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "jsonschema>=4.22",
]

[project.scripts]
halo = "halo.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/halo", "contracts"]

[tool.pytest.ini_options]
testpaths = ["contracts/tests", "backend", "rig"]

[tool.ruff]
line-length = 120

[tool.importlinter]
root_package = "halo"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Backend modules only talk over the bus (app.py is the one exception)"
type = "forbidden"
source_modules = [
    "halo.bus", "halo.llm", "halo.gateway", "halo.event_store", "halo.transcriber",
    "halo.correlator", "halo.insight", "halo.classifier", "halo.notes_builder",
    "halo.notes_service", "halo.recorder",
]
forbidden_modules = [
    "halo.gateway", "halo.event_store", "halo.transcriber", "halo.correlator",
    "halo.insight", "halo.classifier", "halo.notes_builder", "halo.notes_service", "halo.recorder",
]
ignore_imports = "halo.app -> halo.*"
