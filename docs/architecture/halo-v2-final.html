as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;L_wave\&quot; value=\&quot;Build waves: contracts first, then the test rig, then modules. Arrow = unblocks. A wave merges only when its offline tests are green in CI.\&quot; style=\&quot;swimlane;startSize=30;html=1;fontSize=13;fontStyle=1;fillColor=#f7f1fa;strokeColor=#9673a6;container=1;collapsible=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;60\&quot; width=\&quot;3700\&quot; height=\&quot;300\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;w0\&quot; value=\&quot;&amp;lt;b&amp;gt;Wave 0 · /contracts · Oct 31 morning (W1 only)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Envelope + ACK rules, the two-plane rule, event catalog (AsyncAPI + JSON Schema), clock + coordinate rules, MeetingAdapter interface, codegen (TS + pydantic), a golden sample per type, the contract test kit (chaos, exactly-once, boundary check).&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Done = every golden sample validates, codegen output committed, boundary check runs in CI.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_wave\&quot;&gt;&lt;mxGeometry x=\&quot;30\&quot; y=\&quot;50\&quot; width=\&quot;460\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;w1\&quot; value=\&quot;&amp;lt;b&amp;gt;Wave 1 · LEAN test rig · Oct 31-Nov 1 (W3)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Fake Meet page (grows from day0 fixture.html; video + canvas-only modes) + Playwright, FakeASR, FakeLLM (Spark Open + Spark 1.3 contributor), Replayer (mode A fake extension, mode B fake backend), Fixture Capture. Checks = plain test asserts against one frozen real-engine run that Karim spot-checks.&amp;lt;br&amp;gt;Fixtures: Karim records 2-3 bilingual calls.&amp;lt;br&amp;gt;Until the rig lands, modules test against /contracts golden samples.&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Done = one fixture replays through the Gateway and the asserts pass.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_wave\&quot;&gt;&lt;mxGeometry x=\&quot;550\&quot; y=\&quot;50\&quot; width=\&quot;560\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;w2\&quot; value=\&quot;&amp;lt;b&amp;gt;Wave 2 · Backend critical path · Oct 31-Nov 1 (W1)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Gateway (pairing, ACK, dedupe, system.status), EventBus, Event Store, Transcriber, Correlator, Insight.&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Done = replay golden (L2) green with the fakes.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#dae8fc;strokeColor=#6c8ebf;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_wave\&quot;&gt;&lt;mxGeometry x=\&quot;1170\&quot; y=\&quot;40\&quot; width=\&quot;600\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;w3\&quot; value=\&quot;&amp;lt;b&amp;gt;Wave 3 · Extension critical path · Oct 31-Nov 1 (W2)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Setup Panel + pairing + consent, Capture, Meet Adapter (MeetingAdapter), Frame Source (path A; path B fallback), Face Detector, Overlay.&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Done = Playwright on the Fake Meet page (L3) green.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_wave\&quot;&gt;&lt;mxGeometry x=\&quot;1170\&quot; y=\&quot;170\&quot; width=\&quot;600\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;w4\&quot; value=\&quot;&amp;lt;b&amp;gt;Wave 4 · Integrate · Nov 1 night → Nov 2&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Nov 1 night: THIN end-to-end on the Replay rig (audio → transcript → point → bubble, Frame mode).&amp;lt;br&amp;gt;Nov 2: Face mode + live Meet; second ring: Classifier, Notes Builder, Notes Service, Notes page, Recorder.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Done = full replay golden incl. notes.ready + tags.set, plus Notes page HTTP snapshot tests.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffe6cc;strokeColor=#d79b00;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_wave\&quot;&gt;&lt;mxGeometry x=\&quot;1830\&quot; y=\&quot;50\&quot; width=\&quot;520\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;w5\&quot; value=\&quot;&amp;lt;b&amp;gt;Wave 5 · Ship · Nov 2 night → submit Nov 3&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Nov 2 night: live Meet rehearsal (L5), cut list applied to anything not solid. Packaging: README install steps + one command (&amp;lt;i&amp;gt;halo&amp;lt;/i&amp;gt;) that starts the backend and prints the pairing code.&amp;lt;br&amp;gt;Nov 3: record the 3-min demo video, submit (public repo + video).&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Done = submitted.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f8cecc;strokeColor=#b85450;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_wave\&quot;&gt;&lt;mxGeometry x=\&quot;2410\&quot; y=\&quot;50\&quot; width=\&quot;480\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ladder\&quot; value=\&quot;&amp;lt;b&amp;gt;Test ladder: what runs where&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font face='Courier New'& label; ⇄ ACK = acknowledged envelope (ACK = accepted on the bus, not processed). Grey mono box = JSON type, plain dashed line to its module.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Data plane&amp;lt;/b&amp;gt; (binary audio + rec chunks): no envelope, no ACK. &amp;lt;b&amp;gt;Control plane&amp;lt;/b&amp;gt;: envelopes ⇄ ACK. Green dashed arrow = in-tab call, never on the wire.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Colours: green = extension · blue = backend · red = paid model API · purple = test tooling (never shipped) · white = /contracts · yellow = notes for Karim. &amp;lt;font color=&amp;quot;#c92a2a&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Thick red border/arrow = critical path&amp;lt;/b&amp;gt;&amp;lt;/font&amp;gt;; &amp;lt;font color=&amp;quot;#c92a2a&amp;quot;&amp;gt;&amp;lt;i&amp;gt;✂ n&amp;lt;/i&amp;gt;&amp;lt;/font&amp;gt; = cut line n; &amp;lt;i&amp;gt;ring 2&amp;lt;/i&amp;gt; = second ring.&amp;lt;br&amp;gt;Inside the backend every arrow is an EventBus topic; the Event Store taps all of them. One meeting clock (browser ts_ms).\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;400\&quot; width=\&quot;700\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;L_notes\&quot; value=\&quot;Browser tab: Notes page (served by the backend) · ring 2\&quot; style=\&quot;swimlane;startSize=30;html=1;fontSize=13;fontStyle=1;fillColor=#fafafa;strokeColor=#999999;container=1;collapsible=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;780\&quot; y=\&quot;400\&quot; width=\&quot;700\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;notespage\&quot; value=\&quot;&amp;lt;b&amp;gt;Notes page&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Build from &amp;lt;i&amp;gt;docs/ui/notes-v2.html?palette=2&amp;lt;/i&amp;gt; (People First, Sage &amp;amp;amp; Clay). Meeting list + search; per person: role, relevant points, own points, action items grouped Urgent / Medium / Later. Points link to transcript line + recording moment. One-click re-tag.&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#c92a2a&amp;quot;&amp;gt;&amp;lt;i&amp;gt;✂ 5 re-tag menu · ✂ 6 Arabic polish beyond RTL&amp;lt;/i&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;W4 · test: HTTP snapshots on a replay-seeded DB.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_notes\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;35\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_http\&quot; value=\&quot;HTTP (JSON, no envelope)&amp;#10;GET  /notes/{meeting_id} -&amp;gt; HTML&amp;#10;GET  /api/meetings?project_id=&amp;#10;GET  /api/search?q=&amp;#10;GET  /api/meetings/{id}/export.md&amp;#10;POST /api/tags { target_id,&amp;#10;  category?, urgency? }&amp;#10;GET /pair  POST /pair {code}-&amp;gt;{token}\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_notes\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;35\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_notespage\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_notes\&quot; source=\&quot;t_http\&quot; target=\&quot;notespage\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;crit\&quot; value=\&quot;&amp;lt;b&amp;gt;&amp;lt;font color=&amp;quot;#c92a2a&amp;quot;&amp;gt;Critical path&amp;lt;/font&amp;gt; (DECISIONS §8: the demo dies if any link fails)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Tab + Mic Capture → Gateway → Transcriber → Correlator → Insight → Gateway → Overlay, plus Meet Adapter (tiles, names, speaking highlight) → Frame Source → Face Detector → Overlay. Integrate and demo this chain end to end FIRST on the Replay rig, then live.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Second ring:&amp;lt;/b&amp;gt; Event Store, Notes Service + Notes page, Setup Panel, Classifier.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Cut lines, in this order if time runs out:&amp;lt;/b&amp;gt; ✂1 SAM 3.1 stretch · ✂2 Zoom/Teams adapters · ✂3 Recorder (keep transcript links, drop video) · ✂4 Notes Builder per-person depth (keep live points + action list) · ✂5 re-tag menu · ✂6 Arabic UI polish beyond RTL correctness.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Never cut:&amp;lt;/b&amp;gt; consent badge, the critical path, contract validation.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Rules:&amp;lt;/b&amp;gt; everyone in a Halo call wears a headset (echo). Crosstalk: a turn with two speakers is marked overlap; the demo script avoids it. &amp;lt;b&amp;gt;Deadline: submit Nov 3.&amp;lt;/b&amp;gt;\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#fff5f5;strokeColor=#c92a2a;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2820\&quot; y=\&quot;400\&quot; width=\&quot;920\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_http\&quot; value=\&quot;HTTP GET /notes, /api/*, /pair · POST /api/tags\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=1;exitY=0.5;entryX=0.5;entryY=0;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;notespage\&quot; target=\&quot;gw\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1780\&quot; y=\&quot;510\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;L_con\&quot; value=\&quot;/contracts (Wave 0): the only thing modules share · codegen → TS types (extension) + pydantic (backend)\&quot; style=\&quot;swimlane;startSize=30;html=1;fontSize=13;fontStyle=1;fillColor=#fafafa;strokeColor=#999999;container=1;collapsible=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;640\&quot; width=\&quot;700\&quot; height=\&quot;1360\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c_ack\&quot; value=\&quot;&amp;lt;b&amp;gt;Envelope + ACK rules&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Every control-plane JSON message is a CloudEvents 1.0 envelope.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;ACK = accepted on the bus&amp;lt;/b&amp;gt;: validated against the schema, deduped, published (the Event Store persists it). It does NOT mean processed.&amp;lt;br&amp;gt;Sender keeps an outbox: no ACK in 2 s → resend the SAME id (3 tries, then system.status degraded).&amp;lt;br&amp;gt;Every receiver dedupes by id (seen-id set; Event Store id UNIQUE). A duplicate is re-ACKed ok and dropped.&amp;lt;br&amp;gt;Model outputs are always schema-validated (Spark Open does not enforce json_schema).\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;40\&quot; width=\&quot;320\&quot; height=\&quot;230\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_env\&quot; value=\&quot;envelope (CloudEvents 1.0)&amp;#10;{ specversion: &amp;quot;1.0&amp;quot;, id, type,&amp;#10;  source, time, meetingid,&amp;#10;  datacontenttype:&amp;#10;    &amp;quot;application/json&amp;quot;,&amp;#10;  data: {...} }&amp;#10;&amp;#10;ACK&amp;#10;{ ack_of: id,&amp;#10;  status: &amp;quot;ok&amp;quot;|&amp;quot;error&amp;quot;,&amp;#10;  error?: { code, message } }&amp;#10;duplicate id -&amp;gt; ACK ok again,&amp;#10;  do not re-apply\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;40\&quot; width=\&quot;320\&quot; height=\&quot;230\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_c_ack\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_con\&quot; source=\&quot;t_env\&quot; target=\&quot;c_ack\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c_plane\&quot; value=\&quot;&amp;lt;b&amp;gt;Two planes (from draft 5)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Data plane&amp;lt;/b&amp;gt; = binary on the one WebSocket: audio + recording chunks. No envelope, no ACK, no retry, no id. Audio is lossless + ordered (backpressure, not drops). Face frames never cross the wire; the only video sent is the local recording (rec chunks).&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Control plane&amp;lt;/b&amp;gt; = envelopes ⇄ ACK only: lifecycle, context, transcripts, points, tags, status, pairing.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Converters&amp;lt;/b&amp;gt; are the only bridge (binary in, envelopes out): Transcriber, Recorder.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;300\&quot; width=\&quot;320\&quot; height=\&quot;230\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_plane\&quot; value=\&quot;data-plane rules (Gateway data side)&amp;#10;audio kind=1: lossless, ordered FIFO&amp;#10;  per stream; seq gap -&amp;gt; silence&amp;#10;  pad + gap logged; bound 30 s,&amp;#10;  then system.status warn&amp;#10;rec   kind=3: lossless append;&amp;#10;  disk lag -&amp;gt; spill to temp&amp;#10;video: NOT on the wire (in-tab only)&amp;#10;never: ACKs, retries, ids on binary&amp;#10;&amp;#10;control plane: envelopes only,&amp;#10;  ACK, resend same id, dedupe\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;300\&quot; width=\&quot;320\&quot; height=\&quot;230\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_c_plane\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_con\&quot; source=\&quot;t_plane\&quot; target=\&quot;c_plane\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c_cat\&quot; value=\&quot;&amp;lt;b&amp;gt;Event catalog&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;AsyncAPI, 2 channels: extension ⇄ Gateway (one WS: binary + envelopes) and the in-process bus topics. In-tab messages (TileFrame, faces.update) are typed in /contracts too, but never sent.&amp;lt;br&amp;gt;Future-proofing, added now: &amp;lt;b&amp;gt;project_id&amp;lt;/b&amp;gt; (optional) on meeting.context; &amp;lt;b&amp;gt;platform&amp;lt;/b&amp;gt; on meeting.started (MeetingAdapter); faces.update is &amp;lt;b&amp;gt;engine-agnostic&amp;lt;/b&amp;gt;; tags.set for the Classifier.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;560\&quot; width=\&quot;320\&quot; height=\&quot;240\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_cat\&quot; value=\&quot;pair.hello { token, ext_version }&amp;#10;pair.ok { session_id } | pair.rejected&amp;#10;meeting.started { platform:&amp;#10;  &amp;quot;meet&amp;quot;|&amp;quot;zoom&amp;quot;|&amp;quot;teams&amp;quot;,&amp;#10;  meeting_code, t0_ms, self_name }&amp;#10;meeting.ended { reason: left|&amp;#10;  tab_closed|timeout }&amp;#10;  (Gateway synthesizes on dead WS)&amp;#10;system.status {&amp;#10;  asr: ok|reconnecting|down,&amp;#10;  llm: { engine, failover: bool },&amp;#10;  tagger: ok|down,&amp;#10;  outbox_backlog }\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;560\&quot; width=\&quot;320\&quot; height=\&quot;240\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_c_cat\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_con\&quot; source=\&quot;t_cat\&quot; target=\&quot;c_cat\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c_clk\&quot; value=\&quot;&amp;lt;b&amp;gt;Clock + coordinate rules&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;One meeting clock&amp;lt;/b&amp;gt;: browser epoch ms (performance.timeOrigin + now), stamped once at the source in the extension. t0 = meeting.started.t0_ms. The backend never re-stamps meeting time; envelope.time is server wall clock, for logs only.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Boxes&amp;lt;/b&amp;gt; are 0..1 of the SOURCE FRAME (frame_w × frame_h: the tile video in path A, the tile crop in path B). Only the Overlay converts to screen, with tile rect + video size + object-fit.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;830\&quot; width=\&quot;320\&quot; height=\&quot;240\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_clk\&quot; value=\&quot;ts_ms: u64, browser epoch ms&amp;#10;t_rel = ts_ms - t0_ms&amp;#10;&amp;#10;ASR turn time:&amp;#10;  ts = anchor_ts + asr_offset&amp;#10;  (Transcriber keeps seq -&amp;gt; ts_ms&amp;#10;   of the frames it paced, pads incl.)&amp;#10;&amp;#10;box space &amp;quot;source&amp;quot;:&amp;#10;  { frame_w, frame_h,&amp;#10;    box: [x,y,w,h] in 0..1 }&amp;#10;screen = project(box, tile_rect,&amp;#10;  video_w, video_h, object_fit)\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;830\&quot; width=\&quot;320\&quot; height=\&quot;240\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_c_clk\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_con\&quot; source=\&quot;t_clk\&quot; target=\&quot;c_clk\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c_kit\&quot; value=\&quot;&amp;lt;b&amp;gt;Codegen + contract test kit&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;JSON Schema → TS types (extension) and pydantic models (backend). A golden sample per type.&amp;lt;br&amp;gt;Kit: chaos (drop ACK, duplicate, reorder, delay), exactly-once check on events.sqlite, clock checks, module-boundary check (a module imports only /contracts + the bus).\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;1100\&quot; width=\&quot;320\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_kit\&quot; value=\&quot;chaos(drop_ack=0.05,&amp;#10;      duplicate=0.05,&amp;#10;      reorder=0.02,&amp;#10;      delay_ms=[0, 500])&amp;#10;assert_exactly_once(events.sqlite)&amp;#10;assert_monotonic(ts_ms)&amp;#10;check_boundaries(module)\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;1100\&quot; width=\&quot;320\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_c_kit\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_con\&quot; source=\&quot;t_kit\&quot; target=\&quot;c_kit\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;L_ext\&quot; value=\&quot;Chrome extension (WXT/TS, no keys). ONE WebSocket, held by the offscreen doc (alive for the whole capture); Setup Panel, Meet Adapter + Overlay reach it over a chrome.runtime Port\&quot; style=\&quot;swimlane;startSize=30;html=1;fontSize=13;fontStyle=1;fillColor=#fafafa;strokeColor=#999999;container=1;collapsible=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;780\&quot; y=\&quot;640\&quot; width=\&quot;700\&quot; height=\&quot;1170\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;setup\&quot; value=\&quot;&amp;lt;b&amp;gt;Setup Panel + pairing + consent&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Pair once: type the 6-digit code from 127.0.0.1/pair; token kept in chrome.storage.local. Every WS opens with pair.hello. Lives in the toolbar popup: its Start click is the user gesture Chrome needs for tabCapture. Subject, agenda, roles, viewer language, optional project → meeting.context. Posts the Meet chat consent notice (incl. &amp;quot;content may train Meta models&amp;quot;) + shows the badge (never cut).&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#c92a2a&amp;quot;&amp;gt;&amp;lt;i&amp;gt;ring 2 (consent badge: never cut)&amp;lt;/i&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;W3 · test: Playwright + Replayer B.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_ext\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;40\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_setup\&quot; value=\&quot;pair.hello { token, ext_version }&amp;#10;meeting.context&amp;#10;{ subject, agenda,&amp;#10;  roles: [{ name, role }],&amp;#10;  viewer_lang: &amp;quot;en&amp;quot;|&amp;quot;ar&amp;quot;,&amp;#10;  project_id?: string }\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_ext\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;40\&quot; width=\&quot;300\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_setup\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_ext\&quot; source=\&quot;t_setup\&quot; target=\&quot;setup\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;cap\&quot; value=\&quot;&amp;lt;b&amp;gt;Tab + Mic Capture + WS hub&amp;lt;/b&amp;gt; (offscreen doc)&amp;lt;br&amp;gt;Holds the one WebSocket + the envelope outbox; relays Port messages to and from the Meet-page modules. tabCapture id from the popup click (others) + mic (you; headset required). Replays tab audio so you still hear the call. 16 kHz PCM16, 100 ms frames stamped ts_ms. webm chunks for the Recorder. Lends the tab video track to Frame Source only for path B.&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;W3 · test: fake page audio → ts gap-free.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;strokeColor=#c92a2a;strokeWidth=3;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_ext\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;230\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_cap\&quot; value=\&quot;binary audio (data plane)&amp;#10;[kind=1][stream: tab|mic]&amp;#10;[seq u32][ts_ms u64]&amp;#10;+ PCM16 mono 16 kHz, 100 ms&amp;#10;binary rec chunk (data plane)&amp;#10;[kind=3][seq u32][ts_ms u64]&amp;#10;+ webm\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_ext\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;230\&quot; width=\&quot;300\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_cap\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_ext\&quot; source=\&quot;t_cap\&quot; target=\&quot;cap\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;adp\&quot; value=\&quot;&amp;lt;b&amp;gt;Meet Adapter&amp;lt;/b&amp;gt; (implements MeetingAdapter)&amp;lt;br&amp;gt;The only module that knows Meet's DOM (data-participant-id, never class names): tiles, names, self, speaking highlight, tile rect, video element, object-fit. meeting.started on join, meeting.ended on leave or tab close.&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#c92a2a&amp;quot;&amp;gt;&amp;lt;i&amp;gt;✂ 2 Zoom/Teams adapters (roadmap)&amp;lt;/i&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;W3 · test: Fake Meet layouts, join/leave, share.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;strokeColor=#c92a2a;strokeWidth=3;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_ext\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;420\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_adp\&quot; value=\&quot;interface MeetingAdapter {&amp;#10;  platform: &amp;quot;meet&amp;quot;|&amp;quot;zoom&amp;quot;|&amp;quot;teams&amp;quot;&amp;#10;  matches(url): bool&amp;#10;  tiles(): Tile[]  // id, name, is_self,&amp;#10;    rect, video?: HTMLVideoElement,&amp;#10;    video_w, video_h, fit&amp;#10;  onTiles(cb) onSpeaking(cb)&amp;#10;  onJoin(cb)  onLeave(cb) ometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;L_be\&quot; value=\&quot;Backend: one FastAPI modular monolith on this PC (asyncio EventBus, SQLite + FTS5 + local files)\&quot; style=\&quot;swimlane;startSize=30;html=1;fontSize=13;fontStyle=1;fillColor=#fafafa;strokeColor=#999999;container=1;collapsible=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1620\&quot; y=\&quot;640\&quot; width=\&quot;1140\&quot; height=\&quot;1560\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;gw\&quot; value=\&quot;&amp;lt;b&amp;gt;Gateway&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;The backend's only front door. W2.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Pairing: serves /pair (6-digit code → token). The first WS message must be pair.hello with a valid token; Origin must be the extension id.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Data side&amp;lt;/b&amp;gt; (binary, no ACK): audio by stream → Transcriber (ordered, lossless); rec chunks → Recorder. No video frames ever arrive here.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Control side&amp;lt;/b&amp;gt;: validates every envelope against /contracts, dedupes by id, publishes on the EventBus, then ACKs (ACK = accepted on the bus).&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Builds system.status from llm.health, ASR state and tagger health; pushes it every 5 s and on change. Synthesizes meeting.ended on a dead WS.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Serves the Notes page over HTTP; POST /api/tags → tags.set (source: user).&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;W2 · test: L0 contract tests + chaos replay (drop ACK, duplicate) → exactly-once rows in the Event Store.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#dae8fc;strokeColor=#6c8ebf;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;strokeColor=#c92a2a;strokeWidth=3;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_be\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&q gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;fasr\&quot; value=\&quot;&amp;lt;b&amp;gt;FakeASR&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Speaks the Voice realtime WS protocol. Emits the fixture's scripted turns at offsets matching the audio it gets. Knobs: latency, forced session drop, AR/EN code-switch.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_fake\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;40\&quot; width=\&quot;300\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;fllm\&quot; value=\&quot;&amp;lt;b&amp;gt;FakeLLM&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;OpenAI-compatible /v1/chat/completions; stands in for Spark Open and Spark 1.3 contributor. Canned JSON per fixture turn. Knobs: latency spread (forces &amp;amp;gt;4 s failover), invalid-JSON rate (forces retry).\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_fake\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;185\&quot; width=\&quot;300\&quot; height=\&quot;130\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;f_api\&quot; value=\&quot;drop-in: same wire protocol&amp;lt;br&amp;gt;(HALO_ENGINES=fake, per engine)\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=0.5;exitY=0;entryX=0.5;entryY=1;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;L_fake\&quot; target=\&quot;L_api\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;stretch\&quot; value=\&quot;&amp;lt;b&amp;gt;Stretch only · SAM 3.1 Face Refiner&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#c92a2a&amp;quot;&amp;gt;&amp;lt;i&amp;gt;✂ 1: first to cut. Not in the MVP.&amp;lt;/i&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;If time allows: SAM 3.1 masks for a &amp;quot;name tucks behind the head&amp;quot; effect. Plugs in as another faces.update engine (engine: &amp;quot;sam&amp;quot;), so nothing else changes. Runs on the local 3080 Ti, or Modal ($30, optional, never leave a GPU warm). Would be the only thing that ever sends a frame off the tab.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#999999;dashed=1;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;fontColor=#555555;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2820\&quot; y=\&quot;2090\&quot; width=\&quot;340\&quot; height=\&quot;210\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;questions\&quot; value=\&quot;&amp;lt;b&amp;gt;Decided with Karim (2026-10-30)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;· Test rig: lean, built in parallel with W2/W3.&amp;lt;br&amp;gt;· Golden truth: freeze one real-engine run, Karim spot-checks it.&amp;lt;br&amp;gt;· Fixtures: Karim records 2-3 bilingual calls.&amp;lt;br&amp;gt;· Urgency: BOTH. Insight's first guess arrives with the bubble; the Classifier corrects it live every 10 s (only if new points) and tags all action items at meeting end.&amp;lt;br&amp;gt;· Every Spark 1.3 call uses muse-spark-1.3-contributor (Insight failover, Classifier, Notes Builder). Training is fine: open source, no real data.&amp;lt;br&amp;gt;· Pairing: Origin check + one-time 6-digit code.&amp;lt;br&amp;gt;· License: MIT.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Engineering defaults (Claude, from best practice)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;· Face Detector = MediaPipe (official npm, eye/nose key points), WASM + model bundled (MV3 forbids remote code).&amp;lt;br&amp;gt;· Detector runs in a Worker inside a hidden extension iframe; the content script transfers ImageBitmaps (a content script can't start an extension Worker on Meet's page).&amp;lt;br&amp;gt;· Path B paints our overlay out of each crop (no flicker).&amp;lt;br&amp;gt;· Capture starts from the toolbar popup (Chrome's user-gesture rule); tab audio is replayed so you still hear the call.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Still open&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;1. &amp;lt;b&amp;gt;Karim runs the 3 day-0 probes&amp;lt;/b&amp;gt;: meet-overlay (path A vs B), spark-latency (is p90 &amp;amp;lt; 4 s real?), arabic-asr.&amp;lt;br&amp;gt;2. Overlay look for the urgency mark: drafts first (no credit spend).&amp;lt;br&amp;gt;3. Recordings: local, kept until deleted (Karim). Headset required. No X post.\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;3220\&quot; y=\&quot;640\&quot; width=\&quot;520\&quot; height=\&quot;560\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;changes\&quot; value=\&quot;&amp;lt;b&amp;gt;What changed from draft 4&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;1. &amp;lt;b&amp;gt;Faces moved into the browser&amp;lt;/b&amp;gt; (draft 2): Face Detector (MediaPipe/YuNet) is the main path. No GPU worker, no frame traffic, no FakeSAM. Frames never leave the browser.&amp;lt;br&amp;gt;2. Frame Source: path A (tile &amp;amp;lt;video&amp;amp;gt;) is the main path; path B (tab-capture crop, draft 3) is fallback only, picked by the meet-overlay probe.&amp;lt;br&amp;gt;3. faces.update is in-tab only and engine-agnostic (engine: mediapipe | yunet | sam), so SAM 3.1 can plug in later as the ✂1 stretch.&amp;lt;br&amp;gt;4. &amp;lt;b&amp;gt;Two-plane rule&amp;lt;/b&amp;gt; (draft 5) written into /contracts: binary audio + rec = data plane, no ACK; envelopes = control plane, ⇄ ACK; Transcriber + Recorder are the only converters. Gateway drawn with a data side and a control side.&amp;lt;br&amp;gt;5. New &amp;lt;b&amp;gt;Classifier&amp;lt;/b&amp;gt; module on muse-spark-1.3-contributor: live every 10 s + at meeting end, tags.set with category + urgency; Insight adds a first-guess urgency; user re-tag wins. One contributor model box replaces Spark 1.3.&amp;lt;br&amp;gt;6. project_id (optional) on meeting.context, stored with each meeting.&amp;lt;br&amp;gt;7. Platform-neutral &amp;lt;b&amp;gt;MeetingAdapter&amp;lt;/b&amp;gt; interface; meeting.started carries platform.&amp;lt;br&amp;gt;8. Critical path in thick red, ✂ cut lines and ring-2 tags on each module (DECISIONS §8).&amp;lt;br&amp;gt;9. ACK status back to ok | error (DECISIONS §4); a duplicate is re-ACKed ok and dropped.&amp;lt;br&amp;gt;10. Consent notice + badge moved onto the Setup Panel and Overlay (never cut).\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;3220\&quot; y=\&quot;1230\&quot; width=\&quot;520\&quot; height=\&quot;600\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;L_fmeet\&quot; value=\&quot;Fake Meet page (Wave 1)\&quot; style=\&quot;swimlane;startSize=30;html=1;fontSize=13;fontStyle=1;fillColor=#f7f1fa;strokeColor=#9673a6;container=1;collapsible=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;780\&quot; y=\&quot;1850\&quot; width=\&quot;700\&quot; height=\&quot;290\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;pw\&quot; value=\&quot;&amp;lt;b&amp;gt;Playwright harness&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Loads the unpacked extension into Chromium, opens the Fake Meet page, points the extension at Replayer mode B. Asserts overlay DOM positions against the painted ground truth (±4 px), Face Detector IoU on synthetic faces, screenshot diffs, and the envelopes + binary the extension sends. Runs in CI as L3, no keys.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_fmeet\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;40\&quot; width=\&quot;300\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;fmeet\&quot; value=\&quot;&amp;lt;b&amp;gt;Fake Meet page&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Static page copying Meet's DOM anchors (data-participant-id, name spans, self tile, speaking-highlight toggles). Tiles play fixture video or synthetic faces via canvas MediaStreams, object-fit cover at mismatched aspect ratios. Modes: video | canvas-only (no &amp;amp;lt;video&amp;amp;gt;, forces path B). Scripted layouts, join/leave, screen share. Grows from rig/fake_meet/seed-fixture.html (the day-0 probe page).\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_fmeet\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;40\&quot; width=\&quot;300\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;pw_fm\&quot; value=\&quot;drives\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_fmeet\&quot; source=\&quot;pw\&quot; target=\&quot;fmeet\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;fm_ext\&quot; value=\&quot;hosts the real content scripts\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=0.5;exitY=0;entryX=0.7286;entryY=1;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;fmeet\&quot; target=\&quot;L_ext\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;L_rep\&quot; value=\&quot;Replay rig (Wave 1)\&quot; style=\&quot;swimlane;startSize=30;html=1;fontSize=13;fontStyle=1;fillColor=#f7f1fa;strokeColor=#9673a6;container=1;collapsible=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1620\&quot; y=\&quot;2240\&quot; width=\&quot;700\&quot; height=\&quot;500\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;rp\&quot; value=\&quot;&amp;lt;b&amp;gt;Replayer&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Mode A (fake extension): pairs with a test token, sends meeting.started, envelopes and binary audio + rec chunks at their recorded ts_ms (1× real time, or fast on a virtual clock), honours ACK + resend.&amp;lt;br&amp;gt;Mode B (fake backend): replays recorded backend → extension events to the extension on the Fake Meet page.&amp;lt;br&amp;gt;Chaos knobs from the contract kit.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_rep\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;50\&quot; width=\&quot;290\&quot; height=\&quot;210\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;chk\&quot; value=\&quot;&amp;lt;b&amp;gt;Golden asserts&amp;lt;/b&amp;gt; (lean: plain tests, no checker tool)&amp;lt;br&amp;gt;expected.jsonl = one real-engine run on the fixture, frozen, then spot-checked by Karim. Tests assert a run (events.sqlite + what the Replayer received) against it: ts ±300 ms, fuzzy text, ids ignored, order per tile. CI gate (L2) on every PR touching the backend.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_rep\&quot;&gt;&lt;mxGeometry x=\&quot;390\&quot; y=\&quot;50\&quot; width=\&quot;290\&quot; height=\&quot;210\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;fcap\&quot; value=\&quot;&amp;lt;b&amp;gt;Fixture Capture&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Record mode of the real extension on a real call (consent notice on): dumps exactly what it would send, with ts_ms, plus tile frames for detector tests. Synthetic fixture in W1.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_rep\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;300\&quot; width=\&quot;290\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_fix\&quot; value=\&quot;fixtures/&amp;lt;name&amp;gt;/&amp;#10;  meta.json (tiles, roles, t0_ms)&amp;#10;  tab.pcm  mic.pcm  rec.webm&amp;#10;  envelopes.jsonl (ts_ms)&amp;#10;  frames/&amp;lt;tile&amp;gt;/&amp;lt;ts_ms&amp;gt;.jpg&amp;#10;  asr_script.jsonl -&amp;gt; FakeASR&amp;#10;  llm_script.jsonl -&amp;gt; FakeLLM&amp;#10;  faces.jsonl -&amp;gt; detector IoU truth&amp;#10;  expected.jsonl   -&amp;gt; checker\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_rep\&quot;&gt;&lt;mxGeometry x=\&quot;390\&quot; y=\&quot;300\&quot; width=\&quot;290\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_fcap\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_rep\&quot; source=\&quot;t_fix\&quot; target=\&quot;fcap\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;rp_chk\&quot; value=\&quot;results\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_rep\&quot; source=\&quot;rp\&quot; target=\&quot;chk\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;fcap_rp\&quot; value=\&quot;fixtures/\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=0.5;exitY=0;entryX=0.5;entryY=1;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_rep\&quot; source=\&quot;fcap\&quot; target=\&quot;rp\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;rp_gw\&quot; value=\&quot;mode A: plays the extension ⇄ ACK\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=0.2759;exitY=0;entryX=0.3333;entryY=1;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;rp\&quot; target=\&quot;gw\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;rp_fm\&quot; value=\&quot;mode B: plays the backend&amp;lt;br&amp;gt;to the extension ⇄ ACK\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=0;exitY=0.2857;entryX=1;entryY=0.7273;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;rp\&quot; target=\&quot;fmeet\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;&quot;}"></div><script src="https://viewer.diagrams.net/js/viewer-static.min.js"></script></body></html>
