&lt;mxCell id=\&quot;L_wave\&quot; value=\&quot;Build waves: contracts first, then the test rig, then modules. Arrow = unblocks. A wave merges only when its offline tests are green in CI.\&quot; style=\&quot;swimlane;startSize=30;html=1;fontSize=13;fontStyle=1;fillColor=#f7f1fa;strokeColor=#9673a6;container=1;collapsible=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;60\&quot; width=\&quot;3700\&quot; height=\&quot;300\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;w0\&quot; value=\&quot;&amp;lt;b&amp;gt;Wave 0 · /contracts · Oct 31 morning (window W1)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Envelope + ACK rules (ACK on the socket only), the two-plane rule, one JSON Schema per event + a markdown catalog, clock + coordinate rules, MeetingAdapter interface, codegen (pydantic + TS), a golden sample per type, socket ACK tests, import-linter, CI workflow + PR template.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Done = every golden sample validates, codegen committed, CI green.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_wave\&quot;&gt;&lt;mxGeometry x=\&quot;30\&quot; y=\&quot;50\&quot; width=\&quot;460\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;w1\&quot; value=\&quot;&amp;lt;b&amp;gt;Wave 1 · LEAN test rig · Oct 31-Nov 1 (window W3)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Fake Meet page (grows from rig/fake_meet/seed-fixture.html; serves Meet's CSP + Trusted Types; video + canvas-only modes; CC0 photo faces) + Playwright, FakeASR, FakeLLM, Replayer (mode A fake extension, mode B fake backend). CI golden = a committed synthetic fixture. Karim's recorded calls (OBS: screen + separate desktop and mic tracks) stay local for the L4 real run.&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Done = the synthetic fixture replays through the Gateway and the asserts pass.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_wave\&quot;&gt;&lt;mxGeometry x=\&quot;550\&quot; y=\&quot;50\&quot; width=\&quot;560\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;w2\&quot; value=\&quot;&amp;lt;b&amp;gt;Wave 2 · Backend critical path · Oct 31-Nov 1 (window W1)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Gateway (pairing, ACK, dedupe, system.status), EventBus, Event Store, Transcriber, Correlator, Insight.&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Done = replay golden (L2) green with the fakes.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#dae8fc;strokeColor=#6c8ebf;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_wave\&quot;&gt;&lt;mxGeometry x=\&quot;1170\&quot; y=\&quot;40\&quot; width=\&quot;600\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;w3\&quot; value=\&quot;&amp;lt;b&amp;gt;Wave 3 · Extension critical path · Oct 31-Nov 1 (windows W2 + W3)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;W2: Setup Panel, Meet Adapter, Frame Source. W3: Hub + Capture, Face Detector, Overlay.&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Done = Playwright on the Fake Meet page (L3) green.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_wave\&quot;&gt;&lt;mxGeometry x=\&quot;1170\&quot; y=\&quot;170\&quot; width=\&quot;600\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;w4\&quot; value=\&quot;&amp;lt;b&amp;gt;Wave 4 · Integrate · Nov 1 night → Nov 2&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Nov 1 night: THIN end-to-end on the Replay rig (audio → transcript → point → bubble, Frame mode).&amp;lt;br&amp;gt;Nov 2: Face mode + live Meet; second ring: Classifier, Notes Builder, Notes Service, Notes page, Recorder.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Done = full replay golden incl. notes.ready + tags.set, plus Notes page HTTP snapshot tests.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffe6cc;strokeColor=#d79b00;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_wave\&quot;&gt;&lt;mxGeometry x=\&quot;1830\&quot; y=\&quot;50\&quot; width=\&quot;520\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;w5\&quot; value=\&quot;&amp;lt;b&amp;gt;Wave 5 · Ship · Nov 2 night → submit Nov 3&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Nov 2 night: live Meet rehearsal (L5), cut list applied to anything not solid. Packaging: README install steps + one command (&amp;lt;i&amp;gt;halo&amp;lt;/i&amp;gt;) that starts the backend and prints the pairing code.&amp;lt;br&amp;gt;Nov 3: record the 3-min demo video, submit (public repo + video).&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Done = submitted.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f8cecc;strokeColor=#b85450;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_wave\&quot;&gt;&lt;mxGeometry x=\&quot;2410\&quot; y=\&quot;50\&quot; width=\&quot;480\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;ladder\&quot; value=\&quot;&amp;lt;b&amp;gt;Test ladder: what runs where&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font face='Courier New'&amp;gt;L0 contract: schemas + golden samples ...... every PR, $0&amp;lt;br&amp;gt;L1 module unit tests with fakes ............ every PR, $0&amp;lt;br&amp;gt;L2 replay golden, backend (Replayer A) ..... every PR, $0&amp;lt;br&amp;gt;L3 Playwright on Fake Meet (Replayer B) .... every PR, $0&amp;lt;br&amp;gt;L4 real-engine smoke on one fixture ...... on demand, capped&amp;lt;br&amp;gt;L5 live Meet rehearsal ................. before demo, Karim&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;CI runs L0-L3 only: no keys, no GPU, no network. L3 opens the hub with ?halo_test=1 (no toolbar click needed); the Face Detector runs on CC0 photo faces.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_wave\&quot;&gt;&lt;mxGeometry x=\&quot;2950\&quot; y=\&quot;40\&quot; width=\&quot;720\&quot; height=\&quot;245\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s01\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_wave\&quot; source=\&quot;w0\&quot; target=\&quot;w1\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s12\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=1;exitY=0.2273;entryX=0;entryY=0.5;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_wave\&quot; source=\&quot;w1\&quot; target=\&quot;w2\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s13\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=1;exitY=0.8182;entryX=0;entryY=0.5;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_wave\&quot; source=\&quot;w1\&quot; target=\&quot;w3\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s24\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=1;exitY=0.5;entryX=0;entryY=0.2273;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_wave\&quot; source=\&quot;w2\&quot; target=\&quot;w4\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s34\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=1;exitY=0.5;entryX=0;entryY=0.8182;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_wave\&quot; source=\&quot;w3\&quot; target=\&quot;w4\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s45\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_wave\&quot; source=\&quot;w4\&quot; target=\&quot;w5\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;legend\&quot; value=\&quot;&amp;lt;b&amp;gt;Key&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Box = what the module does; italic line = the wave that builds it + its offline test. Arrow = contract on the label; ⇄ ACK = acknowledged envelope, on the extension ⇄ Gateway socket only. Grey mono box = JSON type, plain dashed line to its module.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Data plane&amp;lt;/b&amp;gt; (binary audio + rec chunks): no envelope, no ACK. &amp;lt;b&amp;gt;Control plane&amp;lt;/b&amp;gt;: envelopes ⇄ ACK. Green dashed arrow = in-tab call, never on the wire.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Colours: green = extension · blue = backend · red = paid model API · purple = test tooling (never shipped) · white = /contracts · yellow = notes for Karim. &amp;lt;font color=&amp;quot;#c92a2a&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Thick red border/arrow = critical path&amp;lt;/b&amp;gt;&amp;lt;/font&amp;gt;; &amp;lt;font color=&amp;quot;#c92a2a&amp;quot;&amp;gt;&amp;lt;i&amp;gt;✂ n&amp;lt;/i&amp;gt;&amp;lt;/font&amp;gt; = cut line n; &amp;lt;i&amp;gt;ring 2&amp;lt;/i&amp;gt; = second ring.&amp;lt;br&amp;gt;Inside the backend every arrow is an EventBus topic (publish returns an ack at once, no resend); the Event Store taps all of them. One meeting clock (browser ts_ms).\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;400\&quot; width=\&quot;700\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;L_notes\&quot; value=\&quot;Browser tab: Notes page (served by the backend) · ring 2\&quot; style=\&quot;swimlane;startSize=30;html=1;fontSize=13;fontStyle=1;fillColor=#fafafa;strokeColor=#999999;container=1;collapsible=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;780\&quot; y=\&quot;400\&quot; width=\&quot;700\&quot; height=\&quot;200\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;notespage\&quot; value=\&quot;&amp;lt;b&amp;gt;Notes page&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Build from &amp;lt;i&amp;gt;docs/ui/notes-v2.html?palette=2&amp;lt;/i&amp;gt; (People First, Sage &amp;amp;amp; Clay). Meeting list + search; per person: role, relevant points, own points, action items grouped Urgent / Medium / Later. Points link to transcript line + recording moment. One-click re-tag.&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#c92a2a&amp;quot;&amp;gt;&amp;lt;i&amp;gt;✂ 5 re-tag menu · ✂ 6 Arabic polish beyond RTL&amp;lt;/i&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Wave 4 · test: HTTP snapshots on a replay-seeded DB.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_notes\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;35\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_http\&quot; value=\&quot;HTTP (JSON, no envelope)&amp;#10;GET  /notes/{meeting_id} -&amp;gt; HTML shell&amp;#10;GET  /api/meetings/{id} -&amp;gt; page JSON&amp;#10;GET  /api/meetings?project_id=&amp;#10;GET  /api/search?q=&amp;#10;GET  /api/meetings/{id}/export.md&amp;#10;POST /api/tags { target_id,&amp;#10;  category?, urgency? }&amp;#10;GET /pair  POST /pair {code}-&amp;gt;{token}\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_notes\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;35\&quot; width=\&quot;300\&quot; height=\&quot;165\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_notespage\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_notes\&quot; source=\&quot;t_http\&quot; target=\&quot;notespage\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;crit\&quot; value=\&quot;&amp;lt;b&amp;gt;&amp;lt;font color=&amp;quot;#c92a2a&amp;quot;&amp;gt;Critical path&amp;lt;/font&amp;gt; (DECISIONS §8: the demo dies if any link fails)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Tab + Mic Capture → Gateway → Transcriber → Correlator → Insight → Gateway → Overlay, plus Meet Adapter (tiles, names, speaking highlight) → Frame Source → Face Detector → Overlay. Integrate and demo this chain end to end FIRST on the Replay rig, then live.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Second ring:&amp;lt;/b&amp;gt; Event Store, Notes Service + Notes page, Setup Panel, Classifier.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Cut lines, in this order if time runs out:&amp;lt;/b&amp;gt; ✂1 SAM 3.1 stretch · ✂2 Zoom/Teams adapters · ✂3 Recorder (keep transcript links, drop video) · ✂4 Notes Builder per-person depth (keep live points + action list) · ✂5 re-tag menu · ✂6 Arabic UI polish beyond RTL correctness.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Never cut:&amp;lt;/b&amp;gt; consent badge, the critical path, contract validation.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Rules:&amp;lt;/b&amp;gt; everyone in a Halo call wears a headset (echo). Crosstalk: a turn with two speakers is marked overlap; the demo script avoids it. &amp;lt;b&amp;gt;Deadline: submit Nov 3.&amp;lt;/b&amp;gt;\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#fff5f5;strokeColor=#c92a2a;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2820\&quot; y=\&quot;400\&quot; width=\&quot;920\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;e_http\&quot; value=\&quot;HTTP GET /notes, /api/*, /pair · POST /api/tags\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=1;exitY=0.5;entryX=0.5;entryY=0;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;notespage\&quot; target=\&quot;gw\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;1780\&quot; y=\&quot;510\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;L_con\&quot; value=\&quot;/contracts (Wave 0): the only thing modules share · codegen → TS types (extension) + pydantic (backend)\&quot; style=\&quot;swimlane;startSize=30;html=1;fontSize=13;fontStyle=1;fillColor=#fafafa;strokeColor=#999999;container=1;collapsible=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;640\&quot; width=\&quot;700\&quot; height=\&quot;1360\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c_ack\&quot; value=\&quot;&amp;lt;b&amp;gt;Envelope + ACK rules&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Every JSON message is a CloudEvents 1.0 envelope.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;ACK lives on the socket&amp;lt;/b&amp;gt; (extension ⇄ Gateway, the only place a message can get lost): ACK = validated, deduped, on the bus. The hub keeps an outbox: no ACK in 2 s, or a reconnect → resend the SAME id (3 tries, then status degraded). Gateway and Overlay dedupe by id.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Inside the backend&amp;lt;/b&amp;gt; bus.publish() returns a typed Ack at once: same schema, no retries.&amp;lt;br&amp;gt;Model outputs are always schema-validated.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;40\&quot; width=\&quot;320\&quot; height=\&quot;230\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_env\&quot; value=\&quot;envelope (CloudEvents 1.0)&amp;#10;{ specversion: &amp;quot;1.0&amp;quot;, id, type,&amp;#10;  source, time, meetingid,&amp;#10;  datacontenttype:&amp;#10;    &amp;quot;application/json&amp;quot;,&amp;#10;  data: {...} }&amp;#10;&amp;#10;ACK&amp;#10;{ ack_of: id,&amp;#10;  status: &amp;quot;ok&amp;quot;|&amp;quot;error&amp;quot;,&amp;#10;  error?: { code, message } }&amp;#10;duplicate id -&amp;gt; ACK ok again,&amp;#10;  do not re-apply\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;40\&quot; width=\&quot;320\&quot; height=\&quot;230\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_c_ack\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_con\&quot; source=\&quot;t_env\&quot; target=\&quot;c_ack\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c_plane\&quot; value=\&quot;&amp;lt;b&amp;gt;Two planes (from draft 5)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Data plane&amp;lt;/b&amp;gt; = binary on the one WebSocket: audio + recording chunks. No envelope, no ACK, no retry, no id. Audio is lossless + ordered (backpressure, not drops). Face frames never cross the wire; the only video sent is the local recording (rec chunks).&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Control plane&amp;lt;/b&amp;gt; = envelopes ⇄ ACK only: lifecycle, context, transcripts, points, tags, status, pairing.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Converters&amp;lt;/b&amp;gt; are the only bridge (binary in, envelopes out): Transcriber, Recorder.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;300\&quot; width=\&quot;320\&quot; height=\&quot;230\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_plane\&quot; value=\&quot;data-plane rules (Gateway data side)&amp;#10;audio kind=1: lossless, ordered FIFO&amp;#10;  per stream; seq gap -&amp;gt; silence&amp;#10;  pad + gap logged; bound 30 s,&amp;#10;  then system.status warn&amp;#10;rec   kind=3: lossless append;&amp;#10;  disk lag -&amp;gt; spill to temp&amp;#10;face frames: NOT on the wire (in-tab);&amp;#10;  recording video = rec chunks&amp;#10;never: ACKs, retries, ids on binary&amp;#10;&amp;#10;control plane: envelopes only,&amp;#10;  ACK, resend same id, dedupe\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;300\&quot; width=\&quot;320\&quot; height=\&quot;230\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_c_plane\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_con\&quot; source=\&quot;t_plane\&quot; target=\&quot;c_plane\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c_cat\&quot; value=\&quot;&amp;lt;b&amp;gt;Event catalog&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;One JSON Schema per type + a markdown table (type → emitter → consumers). In-tab messages (TileFrame, faces.update) are typed too, never sent.&amp;lt;br&amp;gt;Future-proofing, added now: &amp;lt;b&amp;gt;project_id&amp;lt;/b&amp;gt; (optional) on meeting.context; &amp;lt;b&amp;gt;platform&amp;lt;/b&amp;gt; on meeting.started (MeetingAdapter); faces.update is &amp;lt;b&amp;gt;engine-agnostic&amp;lt;/b&amp;gt;; &amp;lt;b&amp;gt;meeting_id&amp;lt;/b&amp;gt; is a UUID minted by the hub at Start.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;560\&quot; width=\&quot;320\&quot; height=\&quot;240\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_cat\&quot; value=\&quot;pair.hello { token, ext_version }&amp;#10;pair.ok { session_id } | pair.rejected&amp;#10;meeting.started { meeting_id (UUID),&amp;#10;  platform: &amp;quot;meet&amp;quot;|&amp;quot;zoom&amp;quot;|&amp;quot;teams&amp;quot;,&amp;#10;  meeting_code, t0_ms, self_name }&amp;#10;meeting.ended { reason: left|&amp;#10;  tab_closed|timeout }&amp;#10;  (Gateway: after 60 s with no WS)&amp;#10;system.status {&amp;#10;  asr: ok|reconnecting|down,&amp;#10;  llm: { engine, failover: bool },&amp;#10;  tagger: ok|down, outbox_backlog }\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;560\&quot; width=\&quot;320\&quot; height=\&quot;240\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_c_cat\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_con\&quot; source=\&quot;t_cat\&quot; target=\&quot;c_cat\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c_clk\&quot; value=\&quot;&amp;lt;b&amp;gt;Clock + coordinate rules&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;One meeting clock&amp;lt;/b&amp;gt;: browser epoch ms (performance.timeOrigin + now), stamped once at the source in the extension. t0 = meeting.started.t0_ms. The backend never re-stamps meeting time; envelope.time is server wall clock, for logs only.&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Boxes&amp;lt;/b&amp;gt; are 0..1 of the SOURCE FRAME (frame_w × frame_h of the tile video). Only the Overlay converts to screen, with tile rect + video size + object-fit.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;830\&quot; width=\&quot;320\&quot; height=\&quot;240\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_clk\&quot; value=\&quot;ts_ms: u64, browser epoch ms&amp;#10;t_rel = ts_ms - t0_ms&amp;#10;&amp;#10;ASR turn time:&amp;#10;  ts = anchor_ts + asr_offset&amp;#10;  (Transcriber keeps seq -&amp;gt; ts_ms&amp;#10;   of the frames it paced, pads incl.)&amp;#10;&amp;#10;box space &amp;quot;source&amp;quot;:&amp;#10;  { frame_w, frame_h,&amp;#10;    box: [x,y,w,h] in 0..1 }&amp;#10;screen = project(box, tile_rect,&amp;#10;  video_w, video_h, object_fit)\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;830\&quot; width=\&quot;320\&quot; height=\&quot;240\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_c_clk\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_con\&quot; source=\&quot;t_clk\&quot; target=\&quot;c_clk\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;c_kit\&quot; value=\&quot;&amp;lt;b&amp;gt;Codegen + contract tests&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;JSON Schema → pydantic models (backend) and TS types (extension), one command. A golden sample per type, validated in CI. Socket tests: drop an ACK → resend the same id; send a duplicate → one row. import-linter keeps backend modules in their lanes.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#333333;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;1100\&quot; width=\&quot;320\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_kit\&quot; value=\&quot;validate(golden/*.json)&amp;#10;socket: drop_ack -&amp;gt; resend same id&amp;#10;socket: duplicate -&amp;gt; 1 row&amp;#10;assert_monotonic(ts_ms)&amp;#10;import-linter: module lanes\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_con\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;1100\&quot; width=\&quot;320\&quot; height=\&quot;160\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_c_kit\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_con\&quot; source=\&quot;t_kit\&quot; target=\&quot;c_kit\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;L_ext\&quot; value=\&quot;Chrome extension (WXT/TS, no keys). ONE WebSocket, held by the offscreen doc (alive for the whole capture); Setup Panel, Meet Adapter + Overlay reach it over a chrome.runtime Port\&quot; style=\&quot;swimlane;startSize=30;html=1;fontSize=13;fontStyle=1;fillColor=#fafafa;strokeColor=#999999;container=1;collapsible=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;780\&quot; y=\&quot;640\&quot; width=\&quot;700\&quot; height=\&quot;1170\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;setup\&quot; value=\&quot;&amp;lt;b&amp;gt;Setup Panel&amp;lt;/b&amp;gt; (toolbar popup)&amp;lt;br&amp;gt;Its Start click is the user gesture tabCapture needs. Pairing UI: type the 6-digit code once; token in chrome.storage.local (manifest key pinned so the extension id never changes). Subject, agenda, roles, language, optional project → meeting.context. Consent: copies the chat notice to the clipboard; badge always on.&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#c92a2a&amp;quot;&amp;gt;&amp;lt;i&amp;gt;ring 2 (consent badge: never cut)&amp;lt;/i&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Wave 3 · test: Playwright + Replayer B.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_ext\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;40\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_setup\&quot; value=\&quot;POST /pair {code} -&amp;gt; {token}&amp;#10;meeting.context&amp;#10;{ subject, agenda,&amp;#10;  roles: [{ name, role }],&amp;#10;  viewer_lang: &amp;quot;en&amp;quot;|&amp;quot;ar&amp;quot;,&amp;#10;  project_id?: string }\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_ext\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;40\&quot; width=\&quot;300\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_setup\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_ext\&quot; source=\&quot;t_setup\&quot; target=\&quot;setup\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;cap\&quot; value=\&quot;&amp;lt;b&amp;gt;Hub + Tab/Mic Capture&amp;lt;/b&amp;gt; (offscreen doc)&amp;lt;br&amp;gt;Opened by Start: mints meeting_id, holds the one WebSocket (pair.hello on every connect, envelope outbox), relays Port messages to the Meet-page modules. tabCapture (others) + mic (you; headset). 16 kHz PCM16, 100 ms frames stamped ts_ms; replays tab audio; webm of tab + mic for the Recorder.&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Wave 3 · test: ?halo_test=1 opens it with fixture audio.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;strokeColor=#c92a2a;strokeWidth=3;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_ext\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;230\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_cap\&quot; value=\&quot;binary audio (data plane)&amp;#10;[kind=1][stream: tab|mic]&amp;#10;[seq u32][ts_ms u64]&amp;#10;+ PCM16 mono 16 kHz, 100 ms&amp;#10;binary rec chunk (data plane)&amp;#10;[kind=3][seq u32][ts_ms u64]&amp;#10;+ webm\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_ext\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;230\&quot; width=\&quot;300\&quot; height=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_cap\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_ext\&quot; source=\&quot;t_cap\&quot; target=\&quot;cap\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;adp\&quot; value=\&quot;&amp;lt;b&amp;gt;Meet Adapter&amp;lt;/b&amp;gt; (implements MeetingAdapter)&amp;lt;br&amp;gt;The only module that knows Meet's DOM (data-participant-id, never class names): tiles, names, self tile (mirrored), speaking highlight, tile rect, &amp;amp;lt;video&amp;amp;gt;, object-fit. Reports join/leave to the hub, which sends meeting.started / .ended.&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#c92a2a&amp;quot;&amp;gt;&amp;lt;i&amp;gt;✂ 2 Zoom/Teams adapters (roadmap)&amp;lt;/i&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Wave 3 · test: Fake Meet layouts, join/leave, share.&amp;lt;/i&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;strokeColor=#c92a2a;strokeWidth=3;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_ext\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;420\&quot; width=\&quot;300\&quot; height=\&quot;150\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_adp\&quot; value=\&quot;interface MeetingAdapter {&amp;#10;  platform: &amp;quot;meet&amp;quot;|&amp;quot;zoom&amp;quot;|&amp;quot;teams&amp;quot;&amp;#10;  matches(url): bool&amp;#10;  tiles(): Tile[]  // id, name, is_self,&amp;#10;    rect, video?: HTMLVideoElement,&amp;#10;    video_w, video_h, fit&amp;#10;  onTiles(cb) onSpeaking(cb)&amp;#10;  onJoin(cb)  onLeave(cb) }&amp;#10;tiles.snapshot { tiles: [...],&amp;#10;  captions_rect?: rect|null }&amp;#10;speaker.active {tile_id,speaking,ts_ms}\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html= ry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;Array as=\&quot;points\&quot;&gt;&lt;mxPoint x=\&quot;690\&quot; y=\&quot;547\&quot;/&gt;&lt;mxPoint x=\&quot;690\&quot; y=\&quot;1012\&quot;/&gt;&lt;/Array&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;L_be\&quot; value=\&quot;Backend: one FastAPI modular monolith on this PC (asyncio EventBus, SQLite + FTS5 + local files)\&quot; style=\&quot;swimlane;startSize=30;html=1;fontSize=13;fontStyle=1;fillColor=#fafafa;strokeColor=#999999;container=1;collapsible=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1620\&quot; y=\&quot;640\&quot; width=\&quot;1140\&quot; height=\&quot;1560\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;gw\&quot; value=\&quot;&amp;lt;b&amp;gt;Gateway&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;The backend's only front door. Wave 2.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Pairing: serves /pair (6-digit code → token). The first WS message must be pair.hello with a valid token; Origin must be the pinned extension id; HTTP checks the Host header (127.0.0.1 only: DNS-rebinding guard).&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Data side&amp;lt;/b&amp;gt; (binary, no ACK): audio by stream → Transcriber (ordered, lossless); rec chunks → Recorder.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Control side&amp;lt;/b&amp;gt;: validates every envelope against /contracts, dedupes by id, publishes on the EventBus, then ACKs. This socket is the ONLY place with ACK + resend; inside the backend, bus.publish() returns an ack at once.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Builds system.status from each module's health() (in-process call); pushes it every 5 s and on change. Synthesizes meeting.ended only after 60 s without a WS (grace for reloads and restarts).&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Serves the Notes page over HTTP; POST /api/tags → tags.set (source: user).&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;i&amp;gt;Wave 2 · test: gt;&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#c92a2a&amp;quot;&amp;gt;&amp;lt;i&amp;gt;✂ 1: first to cut. Not in the MVP.&amp;lt;/i&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;If time allows: SAM 3.1 masks for a &amp;quot;name tucks behind the head&amp;quot; effect. Plugs in as another faces.update engine (engine: &amp;quot;sam&amp;quot;), so nothing else changes. Runs on the local 3080 Ti, or Modal ($30, optional, never leave a GPU warm). Would be the only thing that ever sends a frame off the tab.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#ffffff;strokeColor=#999999;dashed=1;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;fontColor=#555555;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;2820\&quot; y=\&quot;2090\&quot; width=\&quot;340\&quot; height=\&quot;210\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;questions\&quot; value=\&quot;&amp;lt;b&amp;gt;Decided with Karim (2026-10-30)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;· Test rig: lean, built in parallel. CI golden = a committed synthetic fixture; recorded calls stay local.&amp;lt;br&amp;gt;· Urgency: Insight's first guess live + Classifier every 10 s (first ring-2 cut); the Notes Builder tags action items.&amp;lt;br&amp;gt;· Every Spark 1.3 call uses the contributor model; Insight fails over per call and returns to Spark Open after 30 s.&amp;lt;br&amp;gt;· ACK on the socket only (saves ~8-10 agent-hours).&amp;lt;br&amp;gt;· Path B cut: no &amp;amp;lt;video&amp;amp;gt; → Frame mode.&amp;lt;br&amp;gt;· PRs merge on green CI; Claude reviews contracts + critical path.&amp;lt;br&amp;gt;· Pairing: Origin (pinned key) + one-time code. MIT. Recordings local, kept until deleted. Headset required. No X post.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Engineering defaults&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;· MediaPipe, bundled; Worker in a hidden extension iframe.&amp;lt;br&amp;gt;· The hub (offscreen doc) holds the socket and mints meeting_id at Start.&amp;lt;br&amp;gt;· Overlay DOM via textContent (Trusted Types); mirrored self tile.&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;b&amp;gt;Still open&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;1. Karim runs the 3 day-0 probes: meet-overlay, spark-latency, arabic-asr.&amp;lt;br&amp;gt;2. Urgency-mark look: drafts first.\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;3220\&quot; y=\&quot;640\&quot; width=\&quot;520\&quot; height=\&quot;560\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;changes\&quot; value=\&quot;&amp;lt;b&amp;gt;Fixes from the independent review (2026-10-30 night)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;1. Insight now receives turn.attributed (text + who) from the Correlator; before, it got no transcript at all.&amp;lt;br&amp;gt;2. Waves vs windows: waves are 'Wave n', windows are W1-W3; owners live in DECISIONS section 6.&amp;lt;br&amp;gt;3. Test gates CI can actually run: synthetic golden, ?halo_test=1 hub hook, CC0 photo faces.&amp;lt;br&amp;gt;4. ACK on the socket only; chaos kit and AsyncAPI cut.&amp;lt;br&amp;gt;5. meeting_id minted by the hub at Start; meeting.ended after a 60 s grace.&amp;lt;br&amp;gt;6. Per-call failover with return to Spark Open (keeps the open-weights entry honest).&amp;lt;br&amp;gt;7. Notes Builder tags action urgency itself: no race with notes.ready.&amp;lt;br&amp;gt;8. Contracts: Adapter → Overlay tile data, one kind vocabulary, pair.hello from the hub, a tags.set edge, finals only, transcriber.rotated cut.&amp;lt;br&amp;gt;9. Path B cut (a video track can't cross from the capture page to Meet's page).&amp;lt;br&amp;gt;10. Meet realities: Trusted Types, mirrored self tile, highlight-lag knob, Host-header check, pinned extension key, your mic in the recording.\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;3220\&quot; y=\&quot;1230\&quot; width=\&quot;520\&quot; height=\&quot;600\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;L_fmeet\&quot; value=\&quot;Fake Meet page (Wave 1)\&quot; style=\&quot;swimlane;startSize=30;html=1;fontSize=13;fontStyle=1;fillColor=#f7f1fa;strokeColor=#9673a6;container=1;collapsible=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;780\&quot; y=\&quot;1850\&quot; width=\&quot;700\&quot; height=\&quot;290\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;pw\&quot; value=\&quot;&amp;lt;b&amp;gt;Playwright harness&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Loads the unpacked extension into Chromium, opens the Fake Meet page, points the extension at Replayer mode B. Asserts overlay DOM positions against the painted ground truth (±4 px), Face Detector IoU on CC0 photo faces, dev build opening the hub via ?halo_test=1, screenshot diffs, and the envelopes + binary the extension sends. Runs in CI as L3, no keys.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_fmeet\&quot;&gt;&lt;mxGeometry x=\&quot;20\&quot; y=\&quot;40\&quot; width=\&quot;300\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;fmeet\&quot; value=\&quot;&amp;lt;b&amp;gt;Fake Meet page&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Static page copying Meet's DOM anchors (data-participant-id, name spans, self tile, speaking-highlight toggles). Tiles play fixture video or CC0 photo faces via canvas MediaStreams, object-fit cover at mismatched aspect ratios. Modes: video | canvas-only (no &amp;amp;lt;video&amp;amp;gt;, forces Frame mode). Serves Meet's CSP + Trusted Types headers. Scripted layouts, join/leave, screen share. Grows from rig/fake_meet/seed-fixture.html (the day-0 probe page).\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_fmeet\&quot;&gt;&lt;mxGeometry x=\&quot;360\&quot; y=\&quot;40\&quot; width=\&quot;300\&quot; height=\&quot;220\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;pw_fm\&quot; value=\&quot;drives\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_fmeet\&quot; source=\&quot;pw\&quot; target=\&quot;fmeet\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;fm_ext\&quot; value=\&quot;hosts the real content scripts\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=0.5;exitY=0;entryX=0.7286;entryY=1;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;fmeet\&quot; target=\&quot;L_ext\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;L_rep\&quot; value=\&quot;Replay rig (Wave 1)\&quot; style=\&quot;swimlane;startSize=30;html=1;fontSize=13;fontStyle=1;fillColor=#f7f1fa;strokeColor=#9673a6;container=1;collapsible=0;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;&gt;&lt;mxGeometry x=\&quot;1620\&quot; y=\&quot;2240\&quot; width=\&quot;700\&quot; height=\&quot;500\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;rp\&quot; value=\&quot;&amp;lt;b&amp;gt;Replayer&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Mode A (fake extension): pairs with a test token, sends meeting.started, envelopes and binary audio + rec chunks at their recorded ts_ms (1× real time, or fast on a virtual clock), honours ACK + resend.&amp;lt;br&amp;gt;Mode B (fake backend): replays recorded backend → extension events to the extension on the Fake Meet page.&amp;lt;br&amp;gt;Chaos knobs from the contract kit.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_rep\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;50\&quot; width=\&quot;290\&quot; height=\&quot;210\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;chk\&quot; value=\&quot;&amp;lt;b&amp;gt;Golden asserts&amp;lt;/b&amp;gt; (plain tests)&amp;lt;br&amp;gt;CI: a committed synthetic fixture; a run (events.sqlite + what the Replayer received) must match expected.jsonl: ts ±300 ms, fuzzy text, ids ignored, order per tile. Local L4: Karim's recorded calls, one real run frozen + spot-checked, never committed.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_rep\&quot;&gt;&lt;mxGeometry x=\&quot;390\&quot; y=\&quot;50\&quot; width=\&quot;290\&quot; height=\&quot;210\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;fcap\&quot; value=\&quot;&amp;lt;b&amp;gt;Fixture Capture&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Oct 31: Karim records 2-3 calls with OBS (screen + separate desktop and mic tracks), converted to fixtures locally. Later: a record mode in the hub. The synthetic fixture is generated in Wave 1.\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;align=left;verticalAlign=top;spacingLeft=8;spacingRight=6;fontSize=10;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_rep\&quot;&gt;&lt;mxGeometry x=\&quot;40\&quot; y=\&quot;300\&quot; width=\&quot;290\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;t_fix\&quot; value=\&quot;fixtures/&amp;lt;name&amp;gt;/&amp;#10;  meta.json (tiles, roles, t0_ms)&amp;#10;  tab.pcm  mic.pcm  rec.webm&amp;#10;  envelopes.jsonl (ts_ms)&amp;#10;  frames/&amp;lt;tile&amp;gt;/&amp;lt;ts_ms&amp;gt;.jpg&amp;#10;  asr_script.jsonl -&amp;gt; FakeASR&amp;#10;  llm_script.jsonl -&amp;gt; FakeLLM&amp;#10;  faces.jsonl -&amp;gt; detector IoU truth&amp;#10;  expected.jsonl   -&amp;gt; checker\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=0;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;align=left;verticalAlign=top;spacingLeft=6;fontSize=9;fontFamily=Courier New;\&quot; vertex=\&quot;1\&quot; parent=\&quot;L_rep\&quot;&gt;&lt;mxGeometry x=\&quot;390\&quot; y=\&quot;300\&quot; width=\&quot;290\&quot; height=\&quot;170\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;p_fcap\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=none;dashed=1;strokeColor=#999999;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_rep\&quot; source=\&quot;t_fix\&quot; target=\&quot;fcap\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;rp_chk\&quot; value=\&quot;results\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=1;exitY=0.5;entryX=0;entryY=0.5;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_rep\&quot; source=\&quot;rp\&quot; target=\&quot;chk\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;fcap_rp\&quot; value=\&quot;fixtures/\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=0.5;exitY=0;entryX=0.5;entryY=1;\&quot; edge=\&quot;1\&quot; parent=\&quot;L_rep\&quot; source=\&quot;fcap\&quot; target=\&quot;rp\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;rp_gw\&quot; value=\&quot;mode A: plays the extension ⇄ ACK\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=0.2759;exitY=0;entryX=0.3333;entryY=1;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;rp\&quot; target=\&quot;gw\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;rp_fm\&quot; value=\&quot;mode B: plays the backend&amp;lt;br&amp;gt;to the extension ⇄ ACK\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;fontSize=9;labelBackgroundColor=#ffffff;endArrow=block;endFill=1;exitPerimeter=0;entryPerimeter=0;exitX=0;exitY=0.2857;entryX=1;entryY=0.7273;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;rp\&quot; target=\&quot;fmeet\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;&quot;}"></div><script src="https://viewer.diagrams.net/js/viewer-static.min.js"></script></body></html>
