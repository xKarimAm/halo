<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Halo: Arabic and English meetings, understood live">
  <title>Halo</title>
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 3.6s ease-out infinite}
    .ring.b{animation-delay:1.2s}.ring.c{animation-delay:2.4s}
    @keyframes ring{0%{transform:scale(.5);opacity:.75}100%{transform:scale(3.4);opacity:0}}
    .chip{opacity:0;animation:chip 8s cubic-bezier(.22,1,.36,1) infinite}
    .c2{animation-delay:.5s}.c3{animation-delay:1s}.c4{animation-delay:1.5s}
    @keyframes chip{0%{opacity:0;transform:translateX(-18px)}7%{opacity:1;transform:none}82%{opacity:1;transform:none}92%,100%{opacity:0;transform:translateX(12px)}}
    @media (prefers-reduced-motion:reduce){.ring{animation:none;opacity:.25}.chip{animation:none;opacity:1}}
  </style>
  <defs><clipPath id="r"><rect width="1280" height="300" rx="20"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="300" fill="#2a2924"/>
    <rect y="262" width="1280" height="38" fill="#7d776b"/>
    <!-- the extension's icon: sage tile, cream H, gold dot -->
    <g transform="translate(70 62)">
      <rect width="136" height="136" rx="32" fill="#5f7f62"/>
      <path d="M38 34h17v27h28V34h17v70H83V76H55v28H38z" fill="#fbf8f1"/>
      <circle class="ring" cx="115" cy="23" r="11" fill="none" stroke="#e8c98a" stroke-width="3"/>
      <circle class="ring b" cx="115" cy="23" r="11" fill="none" stroke="#e8c98a" stroke-width="3"/>
      <circle class="ring c" cx="115" cy="23" r="11" fill="none" stroke="#e8c98a" stroke-width="3"/>
      <circle cx="115" cy="23" r="11" fill="#e8c98a"/>
    </g>
    <text x="240" y="138" font-size="84" font-weight="700" letter-spacing="-2" fill="#fbf8f1">Halo</text>
    <text x="243" y="184" font-size="25" font-weight="500" fill="#cfc9bb">Arabic and English meetings, understood live.</text>
    <g font-size="19" font-weight="500" fill="#fbf8f1">
      <g class="chip c1"><rect x="860" y="42" width="330" height="44" rx="12" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".22"/><circle cx="886" cy="64" r="11" fill="#fbf8f1"/><text x="886" y="70" font-size="17" text-anchor="middle" fill="#0b0f1a">•</text><text x="908" y="71">A point, on the speaker's tile</text></g>
      <g class="chip c2"><rect x="860" y="94" width="330" height="44" rx="12" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".22"/><circle cx="886" cy="116" r="11" fill="#fbf8f1"/><text x="886" y="122" font-size="15" text-anchor="middle" fill="#0b0f1a">?</text><text x="908" y="123">A question nobody answered</text></g>
      <g class="chip c3"><rect x="860" y="146" width="330" height="44" rx="12" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".22"/><circle cx="886" cy="168" r="11" fill="#fbf8f1"/><text x="886" y="174" font-size="15" text-anchor="middle" fill="#0b0f1a">✓</text><text x="908" y="175">A decision, with its owner</text></g>
      <g class="chip c4"><rect x="860" y="198" width="330" height="44" rx="12" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".22"/><circle cx="886" cy="220" r="11" fill="#fbf8f1"/><text x="886" y="226" font-size="15" text-anchor="middle" fill="#0b0f1a">≠</text><text x="908" y="227">A pushback, while it matters</text></g>
    </g>
    <text x="70" y="287" font-size="16" font-weight="600" fill="#fbf8f1">Muse Voice  ·  Muse Spark  ·  Muse Image  ·  SAM 3.1</text>
    <text x="1210" y="287" font-size="16" font-weight="500" text-anchor="end" fill="#fbf8f1">Runs on your PC  ·  Open source</text>
  </g>
</svg>
