<!doctype html>
<html lang="en" dir="ltr" data-palette="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo Notes v2</title>
<script>{const p=new URLSearchParams(location.search).get('palette');document.documentElement.dataset.palette=/^[123]$/.test(p)?p:'1'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* All design tokens live in the palette blocks below. Every colour, surface and shadow further down is a var(); nothing is hard-coded. */
/* Palettes: picked with ?palette=1|2|3 (default 1) or the switcher in the caption bar. Every colour token lives here. */
/* 1 · Paper & Ink: warm paper, near-black ink, one ink-blue accent, earthy muted categories. */
[data-palette="1"]{
  color-scheme:light;
  --r:16px; --font:'Inter','IBM Plex Sans Arabic',system-ui,sans-serif;
  --blur:blur(14px) saturate(110%);
  --slide:36px;
  --bg:#F6F3EC; --text:#1D1D1F; --muted:#5B5F66; --faint:#615D55; --on-accent:#FFFFFF;
  --glass:rgba(255,255,255,.82); --glass-hi:rgba(43,79,203,.08); --glass-lo:rgba(120,100,60,.05);
  --rim:#DCD9D3; --hair:#E7E4DE; --track:rgba(29,29,31,.10);
  --caption-bg:#EDE9E0; --menu-bg:rgba(255,255,255,.98);
  --aura-1:rgba(232,222,200,.35); --aura-2:rgba(205,216,236,.25); --aura-3:transparent;
  --dec:#1D6A50; --q:#8A5300; --push:#A12B2B; --pt:#2B4FCB;
  --urg-hi:#A3264B; --urg-mid:#7A5C00; --urg-lo:#4E5F72;
  --focus:#2B4FCB; --knob:#1D1D1F; --logo-dot:#1D1D1F;
  --mark-bg:#FFF1B8; --mark-text:#1D1D1F;
  --why-a:rgba(43,79,203,.07);
  --photo:#D2CDC1; --photo-text:#3E3B35;
  --av-s1:31%; --av-l1:33%; --av-ring:45%; --av-glow:70%; --glow-a:0;
  --sh-glass:inset 0 1px 0 rgba(255,255,255,.8);
  --sh-menu:0 12px 28px rgba(29,29,31,.12),0 2px 6px rgba(29,29,31,.06);
  --sh-logo:0 1px 2px rgba(29,29,31,.25);
}
/* 2 · Sage & Clay: warm stone paper, frosted warm-white glass, sage / slate / clay / plum. */
[data-palette="2"]{
  color-scheme:light;
  --r:22px; --font:'Inter','IBM Plex Sans Arabic',system-ui,sans-serif;
  --blur:blur(20px) saturate(115%);
  --slide:36px;
  /* text */
  --bg:#e9e4da; --text:#2a2924; --muted:#57544b; --faint:#625e55; --on-accent:#fbf8f1;
  /* surfaces */
  --glass:rgba(255,252,246,.55); --glass-hi:rgba(255,252,246,.85); --glass-lo:rgba(255,252,246,.30);
  --rim:#d0cabf; --hair:#dbd5cb; --track:rgba(74,64,48,.16);
  --caption-bg:#dfe3d6; --menu-bg:rgba(250,247,241,.985);
  /* backdrop wash: sage, clay, sand */
  --aura-1:rgba(127,154,120,.16); --aura-2:rgba(201,138,104,.13); --aura-3:rgba(214,186,132,.18);
  /* moment types: sage / slate / clay / plum */
  --dec:#3b6343; --q:#3d6079; --push:#9a4526; --pt:#6f5468;
  /* urgency: brick / ochre / grey-sage */
  --urg-hi:#a23b37; --urg-mid:#77590d; --urg-lo:#5a5f56;
  /* accents */
  --focus:#3d6079; --knob:#2a2924; --logo-dot:#5f7f62;
  --mark-bg:rgba(217,180,90,.38); --mark-text:#2a2924;
  --why-a:rgba(127,154,120,.20);
  --photo:#7d776b; --photo-text:#fbf8f1;
  /* avatars (hue per person; muted, mid-dark so light initials pass AA) */
  --av-s1:27%; --av-l1:33%; --av-ring:40%; --av-glow:55%; --glow-a:.22;
  /* shadows: resting glass keeps only its top sheen; menus float */
  --sh-glass:inset 0 1px 0 rgba(255,255,255,.75);
  --sh-menu:0 14px 34px rgba(60,48,30,.16);
  --sh-logo:0 0 10px 2px rgba(95,127,98,.30); /* soft glow only: no ring around the dot */
}
/* 3 · Dusk: lamplit warm charcoal, cream text, dusty sage-teal / ochre / rose / slate. */
[data-palette="3"]{
  color-scheme:dark;
  --r:22px; --font:'Inter','IBM Plex Sans Arabic',system-ui,sans-serif;
  --blur:blur(18px) saturate(115%);
  --slide:36px;
  /* text */
  --bg:#1c1916; --text:#f1e9dc; --muted:#d2c7b6; --faint:#bcb09d; --on-accent:#1c1916;
  /* surfaces */
  --glass:rgba(255,240,220,.05); --glass-hi:rgba(255,240,220,.09); --glass-lo:rgba(255,240,220,.035);
  --rim:#403b34; --hair:#2e2a25; --track:rgba(255,236,210,.14);
  --caption-bg:#262019; --menu-bg:rgba(38,33,28,.985);
  /* backdrop washes: muted, low alpha, no purple-blue */
  --aura-1:rgba(201,140,92,.12); --aura-2:rgba(104,150,140,.10); --aura-3:rgba(190,120,120,.10);
  /* categories: decision sage-teal, open question ochre, pushback dusty rose, point slate */
  --dec:#86c4b4; --q:#dcb46c; --push:#eaa99a; --pt:#a9bccf;
  /* urgency: urgent coral, medium amber, later sage-stone */
  --urg-hi:#f59f8c; --urg-mid:#e3bd70; --urg-lo:#b1b5a8;
  /* bits */
  --focus:#e3bd70; --knob:#f1e9dc; --logo-dot:#f1e9dc;
  --mark-bg:rgba(220,180,108,.26); --mark-text:#fbeccb;
  --why-a:rgba(220,180,108,.12);
  --photo:#4a4139; --photo-text:#dcd2c4;
  /* avatars: low saturation so per-person hues stay mellow */
  --av-s1:30%; --av-l1:68%; --av-ring:66%; --av-glow:60%; --glow-a:.28;
  /* shadows */
  --sh-glass:inset 0 1px 0 rgba(255,240,220,.10);
  --sh-menu:0 14px 34px rgba(0,0,0,.5);
  --sh-logo:0 0 10px 3px rgba(227,189,112,.40);
}
/* after the palettes, so RTL wins the tie on specificity */
[dir=rtl]{--slide:-36px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(40vw 40vw at 12% 18%,var(--aura-1),transparent 70%), /* taste-skill-ignore: palette wash behind the frosted glass */
  radial-gradient(38vw 38vw at 88% 10%,var(--aura-2),transparent 70%), /* taste-skill-ignore */
  radial-gradient(45vw 45vw at 70% 95%,var(--aura-3),transparent 70%),var(--bg)} /* taste-skill-ignore */
[dir=rtl] body,[lang=ar]{font-family:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--rim);border-radius:var(--r);box-shadow:var(--sh-glass)} /* taste-skill-ignore: Halo's frosted glass, owner's rule */
button.glass{box-shadow:none}
.glass:has(.retag[open]){position:relative;z-index:10}
.caption{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:8px 16px;background:var(--caption-bg);border-bottom:1px solid var(--rim);font-size:13px}
.caption b{color:var(--pt)} .caption>span{color:var(--muted);flex:1 1 320px}
.pal{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center}
.pal small{color:var(--muted);margin-inline-end:2px}
.pal button{padding:3px 10px;border-radius:999px;border:1px solid var(--rim);font-size:12px;font-weight:600;color:var(--muted)}
.pal button:hover{background:var(--glass-hi)}
.pal button[aria-pressed=true]{color:var(--text);background:var(--glass-hi);border-color:var(--text)}
.top{display:flex;align-items:center;gap:14px;padding:14px 24px;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--logo-dot);box-shadow:var(--sh-logo)}
.crumb{color:var(--muted);font-size:14px} .crumb button{text-decoration:underline;text-underline-offset:3px}
.sp{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:999px}
.seg button{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--glass-hi);color:var(--text)}
.btn{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px}
.btn:hover{background:var(--glass-hi)}
main{padding:0 24px 40px;max-width:1440px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px;line-height:1.25} h2{font-size:15px;color:var(--text);margin:0 0 10px;font-weight:600}
h3{font-size:13px;font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:7px;color:var(--u,var(--text))}
h3 em,.filters em{font-style:normal;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:14px}
ul{list-style:none;margin:0;padding:0}
mark{background:var(--mark-bg);color:var(--mark-text);border-radius:4px;padding:0 2px}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.udot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;background:var(--u)}
.c-dec{--c:var(--dec)} .c-q{--c:var(--q)} .c-push{--c:var(--push)} .c-pt{--c:var(--pt)}
.u-hi{--u:var(--urg-hi)} .u-mid{--u:var(--urg-mid)} .u-lo{--u:var(--urg-lo)}
/* list view */
.search{display:flex;align-items:center;gap:10px;padding:12px 18px;margin:8px 0 18px}
.search input{flex:1;background:none;border:0;color:var(--text);font:inherit;font-size:16px;min-width:0}
.search input::placeholder{color:var(--faint)}
.listgrid{display:grid;grid-template-columns:1fr 1.1fr;gap:20px}
.mtg-card{display:flex;gap:16px;align-items:center;width:100%;text-align:start;padding:16px 18px;margin-bottom:12px}
.mtg-card:hover{background:var(--glass-hi)}
.stack{display:flex} .stack .av{margin-inline-start:-10px;border:2px solid var(--bg)} .stack .av:first-child{margin-inline-start:0}
.hits{padding:16px 18px}
.hit{display:block;width:100%;text-align:start;padding:10px 12px;border-radius:14px}
.hit:hover{background:var(--glass-hi)}
.hit small{color:var(--muted);display:block;font-size:12px}
.kind{font-size:12px;font-weight:600;color:var(--faint)}
/* avatars: hue is per person, saturation/lightness come from the palette */
.av{--s:30px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:max(11px,calc(var(--s)*.36));color:var(--on-accent);
  background:hsl(var(--h) var(--av-s1) var(--av-l1));position:relative;overflow:hidden}
.av.photo{background:var(--photo);color:var(--photo-text)}
.av.photo svg{width:62%;height:62%;margin-top:22%}
/* meeting view */
.mtg{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:22px;align-items:start}
.head{padding:20px 22px;margin-bottom:18px}
.agenda{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.agenda button{padding:5px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--rim);font-size:13px}
.agenda button:hover{background:var(--glass-hi)}
.agenda em{font-style:normal;color:var(--muted);margin-inline-start:6px;font-variant-numeric:tabular-nums}
.people{display:flex;gap:14px;align-items:flex-end;overflow-x:auto;padding:14px 4px 18px;scrollbar-width:thin}
.person{flex:1 0 128px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;border-radius:var(--r);border:1px solid transparent;transition:transform .25s,background .25s,border-color .25s}
.person:nth-child(odd){transform:translateY(-8px)}
.person:hover{background:var(--glass)}
.person[aria-pressed=true]{background:var(--glass-hi);border-color:var(--rim);transform:translateY(-14px)}
.person[aria-pressed=true] .av{box-shadow:0 0 0 3px var(--bg),0 0 0 5px hsl(var(--h) var(--av-s1) var(--av-ring)),0 0 28px 6px hsl(var(--h) var(--av-s1) var(--av-glow) / var(--glow-a))}
.person .av{--s:84px;transition:box-shadow .25s}
.person .nm{font-weight:600} .person .rl{font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.dots{display:flex;gap:4px} .dots i{width:8px;height:8px;border-radius:50%}
.talk{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.all{flex:0 0 auto;align-self:center;padding:10px 14px;border-radius:999px;border:1px dashed var(--rim);font-size:13px;color:var(--muted)}
.all[aria-pressed=true]{color:var(--text);border-style:solid;background:var(--glass-hi)}
/* action board (by urgency) */
.board{padding:16px 18px;margin-bottom:16px}
.bhead{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:8px}
.bhead h2{margin:0}
.prov{margin:0;font-size:12px;color:var(--faint)}
.ugrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ucol{min-width:0}
.ugroup{margin-bottom:10px}
.act{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;margin-bottom:8px;border:1px solid var(--rim);border-inline-start:3px solid var(--u);background:var(--glass-lo)}
.act.sug{border-style:dashed;border-inline-start-style:solid;background:none}
.badge{flex:none;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px}
.badge.as{background:color-mix(in srgb,var(--dec) 15%,transparent);color:var(--dec)}
.badge.sg{background:var(--hair);color:var(--muted)}
.act .body{flex:1;min-width:0}
.act small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ameta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
.ameta .av{--s:20px}
/* category filter + columns */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.filters button{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--rim);background:var(--glass);font-size:13px;font-weight:600}
.filters button:hover{background:var(--glass-hi)}
.filters button[aria-pressed=true]{background:var(--glass-hi);border-color:var(--c,var(--text))}
.filters .ic{color:var(--c)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
/* decisions beside open questions (similar heights); pushbacks and points run full width */
.cols.one{grid-template-columns:minmax(0,1fr)}
.c-pt,.c-push{grid-column:1/-1}
.c-pt ul,.c-push ul,.cols.one ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));column-gap:22px}
.col{padding:16px}
.col h2{color:var(--c);display:flex;align-items:center;gap:7px}
.pt{padding:10px 0 12px;border-top:1px solid var(--hair)} .pt:first-of-type{border-top:0}
.pt-main{display:flex;gap:10px;text-align:start;width:100%}
.pt-main::before{content:"";flex:none;width:4px;border-radius:4px;background:var(--c)}
.pt-main:hover .txt{text-decoration:underline;text-decoration-color:var(--c);text-underline-offset:3px}
.tag{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--c)}
.col .tag{display:none} /* the column heading already names the type */
.tag .ic{width:13px;height:13px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 0;padding-inline-start:14px;font-size:12px;color:var(--muted)}
.meta .av{--s:20px}
.chip{padding:2px 9px;border-radius:999px;border:1px solid var(--rim);font-size:12px;color:var(--muted)}
.chip:hover{color:var(--text);background:var(--glass-hi)}
.mini{display:inline-flex;align-items:center;gap:6px}
.mini:hover span{text-decoration:underline}
blockquote{margin:8px 0 0;margin-inline-start:14px;padding:8px 12px;border-inline-start:2px solid var(--c);background:var(--glass-lo);border-radius:10px;font-size:14px;unicode-bidi:plaintext}
/* re-tag menu: quiet provenance, one click to change */
.retag{position:relative;display:inline-block}
.retag summary{list-style:none;cursor:pointer;font-size:11px;color:var(--faint);padding:2px 6px;border-radius:999px}
.retag summary::-webkit-details-marker{display:none}
.retag:not([open]) .menu{display:none}
.retag summary:hover,.retag[open] summary{color:var(--text);background:var(--glass-hi)}
.menu{position:absolute;z-index:20;top:calc(100% + 4px);inset-inline-start:0;min-width:190px;padding:6px;border-radius:14px;border:1px solid var(--rim);background:var(--menu-bg);box-shadow:var(--sh-menu);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.menu p{margin:2px 8px 6px;font-size:11px;color:var(--faint)}
.menu button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:9px;font-size:13px;color:var(--text);text-align:start}
.menu button:hover{background:var(--glass-hi)}
.menu button .ic{color:var(--c)}
.menu button[aria-checked=true]{background:var(--glass)}
.menu button .ck{margin-inline-start:auto;color:var(--muted)}
/* person panel */
.panel{padding:22px;animation:slideIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(var(--slide))}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.person{transition:none}}
.p-head{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.p-head .av{--s:64px}
.p-head h2{font-size:22px;font-weight:700;line-height:1.25;margin:0 0 4px}
.x{margin-inline-start:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--rim);font-size:18px}
.x:hover{background:var(--glass-hi)}
.why{padding:14px 16px;border-radius:16px;background:var(--why-a);border:1px solid var(--rim);margin-bottom:18px}
.why p{margin:4px 0 0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pgrid > section{min-width:0}
.span2{grid-column:1/-1}
.empty{color:var(--faint);font-size:14px}
/* transcript */
.tx{position:sticky;top:12px;display:flex;flex-direction:column;max-height:calc(100vh - 24px);overflow:hidden}
.player{padding:14px 16px;border-bottom:1px solid var(--rim)}
.prow{display:flex;align-items:center;gap:12px}
.play{width:38px;height:38px;border-radius:50%;background:var(--text);color:var(--on-accent);display:grid;place-items:center;flex:none}
.bar{flex:1;height:6px;border-radius:6px;background:var(--track);position:relative}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:6px;background:var(--focus)}
.bar b{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--knob);transform:translate(-50%,-50%)}
[dir=rtl] .bar b{transform:translate(50%,-50%)}
.time{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);direction:ltr}
.keep{font-size:12px;color:var(--faint);margin-top:8px}
.lines{overflow-y:auto;padding:8px 10px 14px;position:relative;scrollbar-width:thin}
.ln{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px;border-radius:14px;width:100%;text-align:start;border-inline-start:3px solid transparent}
.ln:hover{background:var(--glass-lo)}
.ln.on{background:var(--glass-hi);border-inline-start-color:var(--pt)}
.ln .av{--s:26px;grid-row:span 3}
.ln .who{font-size:12px;color:var(--muted)} .ln .who b{color:var(--text);font-weight:600}
.ln .o{unicode-bidi:plaintext}
.ln .tr{font-size:13px;color:var(--muted)}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);padding:10px 16px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
[dir=rtl] .toast{transform:translateX(50%)}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1100px){.ugrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .mtg,.listgrid{grid-template-columns:minmax(0,1fr)}
  .tx{position:static;max-height:70vh}
  .pgrid{grid-template-columns:1fr}
  .person{flex-basis:100px}
}
@media (max-width:560px){
  main{padding:0 16px 32px} .top{padding:12px 16px}
  .cols{grid-template-columns:1fr}
  .people{align-items:flex-start} .person{flex:0 0 96px} .person .av{--s:60px} .person:nth-child(odd){transform:none}
  .person[aria-pressed=true]{transform:none}
  h1{font-size:20px} .head,.panel,.board{padding:16px}
}
</style>

function hl(text,q){
  const e = esc(text); if(!q) return e;

}

  const l = LN[p.line], open = S.orig[p.id];
  return `<li class="pt c-${p.type}">
    <button class="pt-main" data-line="${p.line}" aria-label="${t(p.type)}: ${esc(L(p))}. ${t('jump')} ${fmt(l.t)}"><span><span class="tag">${icon(p.type)}${t(p.type)}</span><span class="txt">${esc(L(p))}</span></span></button>
    <div class="meta">
      ${showBy?`<button class="mini" data-person="${p.by}">${av(p.by)}<span>${esc(name(p.by))}</span></button>`:''}
      <button class="chip" data-line="${p.line}" title="${t('play')}">▶ <span dir="ltr">${fmt(l.t)}</span></button>
      <button class="chip" data-orig="${p.id}" aria-expanded="${!!open}">${open?t('hide'):t('orig')}</button>
      ${retag(p,'cat')}
    </div>
    ${open?`<blockquote dir="${dirOf(l)}" lang="${langOf(l)}">“${esc(l.orig)}”</blockquote>`:''}
  </li>`;
}

function actHTML(a,showWho){
  return `<li class="act${a.kind==='sg'?' sug':''} u-${a.urg}">
    <span class="badge ${a.kind}">${t(a.kind)}</span>
    <div class="body">${esc(L(a))}<small>${a.kind==='as'?t('asNote'):t('sgNote')}${a.due?` · ${t('due')}: <b>${esc(S.lang==='ar'?a.dueAr:a.due)}</b>`:''}</small>
      <div class="ameta">${showWho?`<button class="mini" data-person="${a.who}">${av(a.who)}<span>${esc(name(a.who))}</span></button>`:''}
        <button class="chip" data-line="${a.line}" title="${t('play')}">▶ <span dir="ltr">${fmt(LN[a.line].t)}</span></button>
        ${retag(a,'urg')}</div></div></li>`;
}

function filtersHTML(list){
  return `<div class="filters" role="group" aria-label="${t('filter')}">
    <button data-cat="all" aria-pressed="${S.cat==='all'}">${t('all')} <em>${list.length}</em></button>
    ${CATS.map(k=>`<button class="c-${k}" data-cat="${k}" aria-pressed="${S.cat===k}">${icon(k)}${t(k)} <em>${list.filter(p=>p.type===k).length}</em></button>`).join('')}
  </div>`;
}

function renderList(){
  $('#view').innerHTML = `
  <h1 style="margin:4px 0 0">${t('meetings')}</h1>
  <label class="search glass"><span aria-hidden="true">⌕</span><span class="sr">${t('search')}</span>
    <input id="q" type="search" value="${esc(S.q)}" placeholder="${t('search')}"></label>
  <div class="listgrid">
    <section aria-label="${t('meetings')}">
      ${MEETINGS.map(m=>`<button class="mtg-card glass" data-open="${m.id}">
        <span class="stack">${m.who.slice(0,4).map(av).join('')}</span>
        <span style="flex:1;min-width:0"><b>${esc(L(m))}</b><br>
          <span class="sub">${S.lang==='ar'?m.dateAr:m.date} · ${m.min} ${S.lang==='ar'?'دقيقة':'min'} · ${S.lang==='ar'?m.sumAr:m.sum}</span><br>
          <span class="sub" style="font-size:12px;color:var(--faint)">${m.video>1?t('vid',{d:m.video}):m.video===1?t('vid1'):t('vidGone')}</span></span>
      </button>`).join('')}
    </section>
    <section class="hits glass" aria-live="polite"><h2>${t('results')}</h2><div id="hits"></div></section>
  </div>`;
  renderHits();
}

function renderHits(){
  const q = S.q.trim().toLowerCase(), out = [];
  if(q){
    const has = s => s.toLowerCase().includes(q);
    for(const p of PTS){ const l=LN[p.line]; const f=[L(p),p.en,p.ar,l.orig].find(has); if(f) out.push({k:t('inPoints')+' · '+t(p.type),txt:f,line:p.line,sp:p.by,m:'m1'}); }
    for(const a of ACTS){ const f=[L(a),a.en,a.ar].find(has); if(f) out.push({k:t('action')+' · '+t(a.urg),txt:f,line:a.line,sp:a.who,m:'m1'}); }
    for(const l of LINES){ const f=[lineTxt(l),l.orig,l.en].find(has); if(f) out.push({k:t('inTx'),txt:f,line:l.id,sp:l.sp,m:'m1'}); }
    for(const m of MEETINGS) for(const s of m.snip||[]) if(has(s)) out.push({k:t('inPoints'),txt:s,m:m.id});
  }
  $('#hits').innerHTML = out.length ? out.map(h=>{
    const m = MEETINGS.find(x=>x.id===h.m);
    const rtl = /[\u0600-\u06FF]/.test(h.txt);
    return `<button class="hit" data-open="${h.m}" ${h.line?`data-line="${h.line}"`:''}>
      <span class="kind">${h.k}</span>
      <div dir="${rtl?'rtl':'ltr'}" style="unicode-bidi:plaintext">${hl(h.txt,S.q.trim())}</div>
      <small>${esc(L(m))}${h.sp?` · ${esc(name(h.sp))} · <span dir="ltr">${fmt(LN[h.line].t)}</span>`:''}</small></button>`;
  }).join('') : `<p class="empty">${q?t('noHits'):''}</p>`;
}

function renderMeeting(){
  const m = MEETINGS[0], sel = S.person;
  const counts = id => CATS.map(k=>PTS.filter(p=>p.by===id&&p.type===k).map(()=>`<i style="background:var(--${k})"></i>`).join('')).join('');
  $('#view').innerHTML = `<div class="mtg">
  <div>
    <section class="head glass">
      <h1>${esc(L(m))}</h1>
      <div class="sub">${S.lang==='ar'?m.dateAr:m.date} 2026 · 30 ${S.lang==='ar'?'دقيقة':'min'} · Google Meet</div>
      <div class="agenda" aria-label="${t('agenda')}"><span class="sub" style="align-self:center">${t('agenda')}:</span>
        ${AGENDA.map(([ln,en,ar])=>`<button data-line="${ln}">${S.lang==='ar'?ar:en}<em dir="ltr">${fmt(LN[ln].t)}</em></button>`).join('')}</div>
    </section>
    <h2 class="sr">${t('people')}</h2>
    <div class="people" role="group" aria-label="${t('people')}">
      <button class="all" data-person="" aria-pressed="${!sel}">${t('everyone')}</button>
      ${ORDER.map(id=>`<button class="person" data-person="${id}" aria-pressed="${sel===id}" style="--h:${P[id].h}">
        ${av(id)}<span class="nm">${esc(name(id))}</span><span class="rl" title="${t('role')}">${esc(role(id))}</span>
        <span class="dots" aria-hidden="true">${counts(id)}</span><span class="talk">${t('talk',{m:P[id].talk})}</span></button>`).join('')}
    </div>
    <div id="stage">${stageHTML()}</div>
  </div>
  <aside class="tx glass" id="tx" aria-label="${t('tx')}"></aside>
  </div>`;
  renderTx();
}

const stageHTML = () => S.person ? personHTML(S.person) : summaryHTML();

function summaryHTML(){
  const col = k => `<section class="col glass c-${k}"><h2>${icon(k)}${t(HEAD[k])}</h2><ul>${PTS.filter(p=>p.type===k).map(p=>pointHTML(p)).join('')||empty('li')}</ul></section>`;
  return `<section class="board glass"><div class="bhead"><h2>${t('actions')}</h2><p class="prov">${t('prov')}</p></div>
    <div class="ugrid">${byUrg(ACTS).map(([u,l])=>`<section class="ucol u-${u}"><h3><i class="udot"></i>${t(u)} <em>${l.length}</em></h3>
      <ul>${l.map(a=>actHTML(a,true)).join('')||empty('li')}</ul></section>`).join('')}</div></section>
  ${filtersHTML(PTS)}
  <div class="cols${S.cat==='all'?'':' one'}">${(S.cat==='all'?CATS:[S.cat]).map(col).join('')}</div>`;
}

function personHTML(id){
  const p = P[id], n = name(id);
  const own = PTS.filter(x=>x.by===id), rel = PTS.filter(x=>x.by!==id && x.rel.includes(id));
  const acts = byUrg(ACTS.filter(a=>a.who===id)).filter(([,l])=>l.length);
  return `<section class="panel glass" aria-label="${esc(n)}" style="--h:${p.h}">
    <div class="p-head">${av(id)}<div><h2>${esc(n)}</h2><div class="sub" title="${t('role')}">${esc(role(id))} · ${t('talk',{m:p.talk})}</div></div>
      <button class="x" data-person="" aria-label="${t('close')}">×</button></div>
    <div class="why"><h2>${t('why',{n})}</h2><p>${esc(S.lang==='ar'?p.whyAr:p.why)}</p></div>
    <div class="pgrid">
      <section class="span2"><div class="bhead"><h2>${t('actions')}</h2><p class="prov">${t('prov')}</p></div>
        ${acts.map(([u,l])=>`<div class="ugroup u-${u}"><h3><i class="udot"></i>${t(u)} <em>${l.length}</em></h3><ul>${l.map(a=>actHTML(a,false)).join('')}</ul></div>`).join('')||empty('p')}</section>
      <div class="span2">${filtersHTML([...own,...rel])}</div>
      <section><h2>${t('own',{n})}</h2><ul>${own.filter(vis).map(x=>pointHTML(x,false)).join('')||empty('li')}</ul></section>
      <section><h2>${t('rel',{n})}</h2><ul>${rel.filter(vis).map(x=>pointHTML(x)).join('')||empty('li')}</ul></section>
    </div></section>`;
}

function renderTx(){
  const cur = LN[S.line], pct = cur.t/DUR*100;
  $('#tx').innerHTML = `<div class="player">
    <div class="prow"><button class="play" aria-label="${t('play')}">▶</button>
      <div class="bar" role="img" aria-label="${fmt(cur.t)} / ${fmt(DUR)}"><i style="width:${pct}%"></i><b style="inset-inline-start:${pct}%"></b></div>
      <span class="time">${fmt(cur.t)} / ${fmt(DUR)}</span></div>
    <div class="keep">${t('keep')}</div></div>
  <h2 style="padding:12px 20px 0">${t('tx')}</h2>
  <div class="lines" id="lines">${LINES.map(l=>{
    const tr = (S.lang==='en' && l.lang!=='en') || (S.lang==='ar' && l.lang==='en');
    return `<button class="ln${l.id===S.line?' on':''}" data-line="${l.id}" id="ln${l.id}" aria-current="${l.id===S.line}">
      ${av(l.sp)}<span class="who"><b>${esc(name(l.sp))}</b> · <span dir="ltr">${fmt(l.t)}</span></span>
      <span class="o" dir="${dirOf(l)}" lang="${langOf(l)}">${esc(l.orig)}</span>
      ${tr?`<span class="tr" dir="${S.lang==='ar'?'rtl':'ltr'}">${t('translated')}: ${esc(lineTxt(l))}</span>`:''}</button>`;}).join('')}</div>`;
  const box = $('#lines'), el = $('#ln'+S.line);
  box.scrollTop = el.offsetTop - box.clientHeight/2 + el.offsetHeight/2;
}

function render(){
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));
  document.querySelectorAll('[data-pal]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pal===document.documentElement.dataset.palette));
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $('#export').hidden = S.view!=='meeting'; $('#export').textContent = '⇩ '+t('export');
  $('#crumb').innerHTML = S.view==='list' ? `<span>${t('meetings')}</span>`
    : `<button data-nav="list">${t('meetings')}</button> / ${esc(L(MEETINGS[0]))}${S.person?' / '+esc(name(S.person)):''}`;
  S.view==='list' ? renderList() : renderMeeting();
}

function toast(msg){ const e=$('#toast'); e.textContent=msg; e.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>e.classList.remove('show'),2200); }

function markdown(){
  const E = T.en, m = MEETINGS[0], ts = ln => `[${fmt(LN[ln].t)}](#t=${LN[ln].t})`, mine = x => x.mine?' _(re-tagged by you)_':'';
  const li = p => `- **${E[p.type]}** · ${p.en} (${P[p.by].n}, ${ts(p.line)})${mine(p)}\n  > ${LN[p.line].orig}`;
  const ai = a => `- [ ] **${E[a.urg]}** · ${a.en} (${P[a.who].n}${a.due?`, due ${a.due}`:''}, ${a.kind==='as'?'assigned aloud':'suggested from role'}, ${ts(a.line)})${mine(a)}`;
  let md = `# ${m.en}\n\n${m.date} 2026 · 30 min · ${ORDER.map(id=>`${P[id].n} (${P[id].role})`).join(', ')}\n\n## Agenda\n${AGENDA.map(a=>`- ${a[1]}`).join('\n')}\n`;
  md += `\n## Action items by urgency\n_Urgency and types classified by Halo's low-cost model; items marked "re-tagged by you" were changed by hand._\n`;
  for(const [u,l] of byUrg(ACTS)) md += `\n### ${E[u]}\n${l.map(ai).join('\n')||'- None'}\n`;
  for(const k of CATS) md += `\n## ${E[HEAD[k]]}\n${PTS.filter(p=>p.type===k).map(li).join('\n')||'- None'}\n`;
  md += `\n## People\n`;
  for(const id of ORDER) md += `\n### ${P[id].n}: ${P[id].role}\n${P[id].why}\n\n${byUrg(ACTS.filter(a=>a.who===id)).flatMap(([,l])=>l).map(ai).join('\n')||'- No action items'}\n`;
  return md;
}

document.addEventListener('click', e=>{
  const g = s => e.target.closest(s);
  document.querySelectorAll('.retag[open]').forEach(d=>{ if(!d.contains(e.target)) d.open=false; });
  let b;
  if((b=g('[data-retag]'))){
    const x = [...PTS,...ACTS].find(o=>o.id===b.dataset.retag), v = b.dataset.val;
    x[x.urg?'urg':'type'] = v; x.mine = true;
    const y = scrollY; render(); scrollTo(0,y); return toast(t('retagged',{v:t(v)}));
  }
  if((b=g('[data-pal]'))){
    document.documentElement.dataset.palette=b.dataset.pal; try{history.replaceState(null,'','?palette='+b.dataset.pal)}catch{} // ponytail: file:// may refuse; the switch still works
    document.querySelectorAll('[data-pal]').forEach(x=>x.setAttribute('aria-pressed',x===b)); return;
  }
  if((b=g('[data-cat]'))){ S.cat=b.dataset.cat; $('#stage').innerHTML=stageHTML(); return; }
  if((b=g('[data-lang]'))){ S.lang=b.dataset.lang; return render(); }
  if((b=g('[data-nav]'))){ S.view='list'; S.person=null; return render(); }
  if((b=g('#export'))){
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([markdown()],{type:'text/markdown'}));
    a.download='halo-notes-2026-10-28.md'; a.click(); URL.revokeObjectURL(a.href); return toast(t('exported'));
  }
  if((b=g('[data-open]'))){
    if(b.dataset.open!=='m1') return toast(t('draftOnly'));
    S.view='meeting'; S.person=null; if(b.dataset.line) S.line=+b.dataset.line; render(); scrollTo(0,0); return;
  }
  if((b=g('[data-orig]'))){ S.orig[b.dataset.orig]=!S.orig[b.dataset.orig]; $('#stage').innerHTML = stageHTML(); return; }
  if((b=g('[data-person]'))){
    S.person=b.dataset.person||null; const st=$('#stage').getBoundingClientRect().top; render();
    if(st<0) $('#stage').scrollIntoView({behavior:'smooth',block:'start'}); return;
  }
  if((b=g('[data-line]'))){
    S.line=+b.dataset.line; renderTx();
    if(innerWidth<=900 && !g('#tx')) $('#tx').scrollIntoView({behavior:'smooth'});
    return;
  }
});
// Keep the re-tag menu on screen (narrow columns, RTL).
document.addEventListener('toggle', e=>{
  const d = e.target; if(!d.matches || !d.matches('.retag') || !d.open) return;
  const m = d.querySelector('.menu'); m.style.translate = '0';
  const r = m.getBoundingClientRect(), dx = r.right > innerWidth-8 ? innerWidth-8-r.right : r.left < 8 ? 8-r.left : 0;
  m.style.translate = dx+'px 0';
}, true);
document.addEventListener('input', e=>{ if(e.target.id==='q'){ S.q=e.target.value; renderHits(); } });
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  const o = document.querySelector('.retag[open]');
  if(o){ o.open=false; o.querySelector('summary').focus(); return; }
  if(S.person){ S.person=null; render(); }
});
render();
</script>
</body>
</html>
