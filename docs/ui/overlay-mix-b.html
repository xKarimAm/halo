<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo Mix B: Black borders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Smoked Glass layout + type, Aurora Glass hue. Each tile sets --h (the person's aurora hue). */
  --base:.66;                                 /* smoked body under the aurora tint; checked against pure white below */
  --type:500 12px/1.25 'Inter',system-ui,sans-serif;
  --blur:blur(16px) saturate(140%) brightness(.85);
  --ink:#fff; --ink-2:rgba(255,255,255,.9); --dark:#0b0f1a;
  --ar:'IBM Plex Sans Arabic','Noto Sans Arabic',Tahoma,sans-serif;
  --meet:#202124;
  /* kind colours: one aurora family, same pastel lightness (sky, lilac, mint, peach) */
  --k-point:#8ecbf5; --k-question:#c3a8ff; --k-decision:#7fdcc0; --k-pushback:#ffb199;
}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--meet);color:#e8eaed;font:14px/1.4 'Inter',system-ui,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
button{font:inherit;color:inherit}

/* caption bar (draft chrome, not product) */
.cap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#17181a;font-size:13px}
.cap .n{font:600 12px/1 'Inter',sans-serif;color:var(--dark);background:#e8eaed;padding:5px 8px;border-radius:6px}
.cap h1{margin:0;font:600 13px/1.4 'Inter',sans-serif;color:#fff}
.cap .idea{color:#bdc1c6;flex:1 1 280px}
.cap .cr{color:#9aa0a6;font-size:12px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.55);border-radius:999px;overflow:hidden} /* taste-skill-ignore: segmented control is a form field, the outline is its affordance */
.seg button{background:none;border:0;padding:4px 12px;cursor:pointer;font-size:12px;font-weight:500;color:#bdc1c6}
.seg button[aria-pressed=true]{background:#fff;color:#111}
.seg button:focus-visible{outline:2px solid #fff;outline-offset:-3px}

/* Meet-like grid */
.grid{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:16px;align-content:center;max-width:1400px;width:100%;margin:0 auto}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.tile{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#3c4043;container-type:inline-size}
.tile>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mname{position:absolute;left:10px;bottom:8px;font-size:12px;color:#fff;background:rgb(0 0 0 / .6);padding:1px 6px;border-radius:4px}

/* aurora-tinted smoked glass: shared by name, bubbles, tails, pop */
.gl{background:
    linear-gradient(120deg,hsl(var(--h) 70% 42% / var(--tint,.26)),hsl(calc(var(--h) + 40) 70% 42% / .14) 55%,hsl(calc(var(--h) - 30) 70% 42% / .2)), /* taste-skill-ignore: locked Aurora Glass tint */
    rgb(12 14 18 / var(--base)); /* taste-skill-ignore: locked Aurora Glass */
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur); /* taste-skill-ignore: locked glass bubbles */
  border:1px solid hsl(var(--h) 85% 86% / .5);color:var(--ink)} /* taste-skill-ignore: locked Smoked Glass hairline rim, tinted per person */

/* the NAME is the halo: glows in the person's hue while they speak */
.name{position:absolute;left:50%;top:var(--head);transform:translate(-50%,calc(-100% - 6px));--tint:.2;
  font:var(--type);font-size:clamp(11px,2.2cqi,13px);letter-spacing:-.01em;padding:4px 10px;border-radius:999px;white-space:nowrap;
  color:var(--ink-2);border-color:hsl(var(--h) 85% 86% / .3);transition:color .3s,border-color .3s,box-shadow .3s}
.speaking .name{--tint:.34;color:#fff;border-color:hsl(var(--h) 90% 86% / .9);box-shadow:0 0 14px hsl(var(--h) 90% 60% / .5); /* taste-skill-ignore: the name is the halo */
  text-shadow:0 0 6px hsl(var(--h) 95% 72% / .9);animation:breathe 2.8s ease-in-out infinite} /* taste-skill-ignore */
@keyframes breathe{50%{text-shadow:0 0 8px hsl(var(--h) 95% 78%),0 0 18px hsl(var(--h) 95% 64% / .85)}} /* taste-skill-ignore: the name is the halo */
@media (prefers-reduced-motion:reduce){.speaking .name{animation:none}}

/* point bubbles beside the face */
.stack{position:absolute;left:var(--bx);top:calc(var(--head) + 1%);display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:calc(98% - var(--bx))}
.b{position:relative;display:block;background:none;border:0;padding:0;cursor:pointer;max-width:100%;text-align:start}
.b .g{display:flex;align-items:center;gap:6px;padding:5px 9px 5px 6px;border-radius:9px;font:var(--type);font-size:clamp(11px,2cqi,12.5px);letter-spacing:-.01em;transition:border-color .15s}
.b .g span:not(.k){display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.b:hover .g,.b:focus-visible .g{--tint:.34;border-color:hsl(var(--h) 90% 90%)}
.b:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:10px}
.t{position:absolute;width:10px;height:10px;left:-4px;top:50%;transform:translateY(-50%) rotate(45deg);
  clip-path:polygon(0 0,0 100%,100% 100%);border-top:0;border-right:0}
[lang=ar]{font-family:var(--ar);letter-spacing:0}

/* kind mark: shape + colour; glyphs use currentColor */
.k{flex:none;width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
.k svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.k-point{--k:var(--k-point)}.k-question{--k:var(--k-question)}.k-decision{--k:var(--k-decision)}.k-pushback{--k:var(--k-pushback)}
.k-pushback[dir=rtl] svg{transform:scaleX(-1)}  /* dir sits on the .k itself (bubble and pop-up) */
/* ICON TREATMENT START */
/* B. black borders: solid kind-colour disc, black glyph, 1.5px black ring */
.k{background:var(--k);color:var(--dark);box-shadow:0 0 0 1.5px var(--dark)} /* taste-skill-ignore: the ring is variant B itself */
/* ICON TREATMENT END */

/* Frame mode (camera off): name + bubble pinned inside the tile */
.frame .name{left:10px;top:10px;transform:none}
.frame .stack{left:10px;top:44px;max-width:calc(100% - 20px)}
.frame .t{display:none}

/* pop-up bubble */
#pop{position:fixed;z-index:9;width:min(340px,calc(100vw - 32px));padding:14px 16px 12px;border-radius:16px;font:14px/1.45 'Inter',system-ui,sans-serif;letter-spacing:-.01em;--base:.74;--tint:.22}
#pop[hidden]{display:none}
#pop .t{left:var(--tx);top:-4px;transform:rotate(135deg)}
#pop.up .t{top:auto;bottom:-4px;transform:rotate(-45deg)}
.ph{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.ph .who{margin-inline-start:auto;font-variant-numeric:tabular-nums}
.ph button{background:none;border:0;cursor:pointer;color:#fff;font-size:18px;line-height:1;padding:0;min-width:24px;min-height:24px}
.ph button:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:4px}
#pop .tx{margin:0 0 10px;font-weight:500;color:#fff}
#pop blockquote{margin:0 0 10px;padding:9px 12px;border-inline-start:2px solid hsl(var(--h) 85% 72% / .85);font:15px/1.7 var(--ar);color:#fff}
#pl{display:block;font:500 12px/1 'Inter',sans-serif;color:var(--ink-2);margin-bottom:6px}
#pop a{color:#fff;font-size:13px;font-weight:500;text-underline-offset:3px;text-decoration-color:hsl(var(--h) 85% 72%)}

/* Meet bottom bar (scenery) */
.bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px 16px;position:relative}
.bar .mt{position:absolute;left:16px;color:#e8eaed;font-size:13px}
.bar i{width:40px;height:40px;border-radius:50%;background:#3c4043;display:block}
.bar i.end{width:56px;border-radius:20px;background:#ea4335}
@media (max-width:720px){.bar .mt{display:none}}
</style>
</head>
<body>

<div class="cap">
  <span class="n">Mix B</span><h1>Black borders</h1>
  <span class="idea">Smoked Glass layout, type and size; Aurora hue in the glass and the name glow. Icons: solid kind-colour disc, black glyph, black border ring.</span>
  <span class="cr" id="cr"></span>
  <div class="seg" role="group" aria-label="Points language">
    <button type="button" data-l="en" aria-pressed="true">EN</button>
    <button type="button" data-l="ar" aria-pressed="false">عربي</button>
  </div>
</div>

<main class="grid" id="grid" aria-label="Simulated Google Meet call"></main>

<div class="bar" aria-hidden="true"><span class="mt">10:42 · Checkout v2: launch readiness</span><i></i><i></i><i></i><i class="end"></i></div>

<div id="pop" class="gl" role="dialog" aria-label="Original quote" hidden>
  <div class="t gl"></div>
  <div class="ph"><span class="k" id="pk"></span><span id="pkind"></span><span class="who" id="pwho"></span><button type="button" id="px" aria-label="Close">×</button></div>
  <p class="tx" id="ptx"></p>
  <span id="pl"></span>
  <blockquote id="pq" lang="ar"></blockquote>
  <a href="#" id="pa"></a>
</div>

<script>
const K = {
  point:   {g:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4" fill="currentColor" stroke="none"/></svg>', en:'Point', ar:'نقطة'},
  question:{g:'<svg viewBox="0 0 16 16"><path d="M5.8 6a2.3 2.3 0 1 1 3.2 2.1c-.6.3-1 .8-1 1.5v.4"/><circle cx="8" cy="12.7" r="1" fill="currentColor" stroke="none"/></svg>', en:'Question', ar:'سؤال'},
  decision:{g:'<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>', en:'Decision', ar:'قرار'},
  pushback:{g:'<svg viewBox="0 0 16 16"><path d="M6.5 3.5L3 7l3.5 3.5M3 7h6.5a3.5 3.5 0 0 1 0 7H8"/></svg>', en:'Pushback', ar:'اعتراض'},
};
const UI = {en:{orig:'Original', open:'Open in notes →'}, ar:{orig:'النص الأصلي', open:'افتح في الملاحظات ←'}};
const Q = {
  L1:{kind:'point',   t:'14:32', en:'Launch moves to Nov 12 if payments QA clears', ar:'الإطلاق ينتقل إلى ١٢ نوفمبر إذا اجتاز اختبار المدفوعات', orig:'يعني الـ launch رح يصير 12 November، بس إذا الـ payments QA خلص هالأسبوع.'},
  L2:{kind:'decision',t:'14:34', en:'Keep Nov 12; address form moves to v2.1', ar:'نُبقي ١٢ نوفمبر، وينتقل نموذج العنوان إلى v2.1', orig:'خلص، منثبّت 12 November والـ address form بيروح على v2.1.'},
  L3:{kind:'question',t:'14:35', en:'Can Rania own Thursday’s regression pass?', ar:'هل تتولى رانيا اختبار الانحدار يوم الخميس؟', orig:'رانيا، فيكي تكوني الـ owner على الـ regression pass يوم الخميس؟'},
  O1:{kind:'pushback',t:'14:33', en:'Nov 12 is tight: Apple Pay sandbox still fails', ar:'١٢ نوفمبر ضيّق: بيئة Apple Pay التجريبية ما زالت تفشل', orig:'بصراحة 12 November كتير tight، الـ Apple Pay sandbox لسا عم يفشل عنا.'},
  Y1:{kind:'point',   t:'14:30', en:'Mobile conversion dropped 4%; the 9% was desktop', ar:'انخفض التحويل على الجوال ٤٪، و٩٪ كانت على سطح المكتب', orig:'الـ conversion نزل تقريباً 9%… لا استنوا، على الموبايل 4%، الـ 9% كانت desktop.'},
};
// h = the person's aurora hue; head = top of head/hijab as % of tile height; bx = where the bubble column starts
const PEOPLE = [
  {name:'Layla', h:285, speaking:1, head:'21%', bx:'66%', pts:['L1','L2','L3'], look:{wall:'#ebe6dc', decor:'window', skin:'#c68e6a', hair:'hijab', hc:'#6e4f9e', shirt:'#2f4858'}},
  {name:'Omar',  h:190, head:'30%', bx:'61%', pts:['O1'], look:{wall:'#2d3a39', decor:'shelf', skin:'#a86f4c', hair:'short', hc:'#1d1714', shirt:'#4b5563', beard:1}},
  {name:'Sarah', h:20,  head:'29%', bx:'61%', pts:[], look:{wall:'#3f3734', decor:'plant', skin:'#ebc3a4', hair:'long', hc:'#8a4b2a', shirt:'#c2734f'}},
  {name:'Yusuf', h:150, frame:1, pts:['Y1']},
];

function person(l){
  const deco = {
    window:'<rect x="90" y="3" width="68" height="64" fill="#fbfcfc"/><path d="M124 3v64M90 34h68" stroke="#dfe3e6" stroke-width="2"/><rect y="67" width="160" height="23" fill="#ddd7cb"/>',
    shelf:'<path d="M106 30h44M106 52h44" stroke="#6b5640" stroke-width="2"/><rect x="110" y="19" width="5" height="11" fill="#9a7b55"/><rect x="117" y="21" width="4" height="9" fill="#5f7d8c"/><rect x="134" y="42" width="9" height="10" fill="#c9b79c"/>',
    plant:'<path d="M24 90V62" stroke="#4a3b2c" stroke-width="3"/><ellipse cx="24" cy="56" rx="11" ry="15" fill="#3f6b4a"/><ellipse cx="17" cy="64" rx="6" ry="9" fill="#4f7d58"/>',
  }[l.decor];
  const back = l.hair==='hijab' ? `<ellipse cx="80" cy="44" rx="19" ry="25" fill="${l.hc}"/><path d="M56 90q2-28 24-28t24 28z" fill="${l.hc}"/>`
             : l.hair==='long'  ? `<path d="M65 42q0-22 15-22t15 22v26H65z" fill="${l.hc}"/>` : '';
  const front = l.hair==='short' ? `<path d="M67 40q0-14 13-14t13 14q-4-7-13-7t-13 7z" fill="${l.hc}"/>`
              : l.hair==='long'  ? `<path d="M67 42q0-16 13-16t13 16q-6-9-13-9t-13 9z" fill="${l.hc}"/>` : '';
  const beard = l.beard ? `<path d="M68 48q2 12 12 12t12-12q-4 5-12 5t-12-5z" fill="${l.hc}"/>` : '';
  return `<svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="90" fill="${l.wall}"/>${deco}${back}`+
    `<path d="M50 90q2-24 30-24t30 24z" fill="${l.shirt}"/><rect x="75" y="54" width="10" height="13" fill="${l.skin}"/>`+
    `<ellipse cx="80" cy="44" rx="13" ry="16" fill="${l.skin}"/>${beard}${front}</svg>`;
}
const avatar = (c,h) => `<svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="90" fill="#3c4043"/><circle cx="80" cy="54" r="14" fill="hsl(${h} 40% 38%)"/><text x="80" y="59" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#fff">${c}</text></svg>`;

let lang = 'en';
const grid = document.getElementById('grid');
function render(){
  grid.innerHTML = PEOPLE.map(p => `
    <div class="tile${p.speaking?' speaking':''}${p.frame?' frame':''}" style="--h:${p.h};--head:${p.head||0};--bx:${p.bx||0}">
      ${p.frame ? avatar(p.name[0], p.h) : person(p.look)}
      <span class="mname">${p.name}</span>
      <span class="name gl">${p.name}</span>
      <div class="stack">${p.pts.map(id => {
        const q = Q[id], txt = q[lang];
        return `<button type="button" dir="${lang==='ar'?'rtl':'ltr'}" class="b" data-id="${id}" data-who="${p.name}" aria-label="${p.name}, ${K[q.kind][lang]}: ${txt}. Show original quote">
          <span class="t gl"></span><span class="g gl"><span class="k k-${q.kind}" dir="${lang==='ar'?'rtl':'ltr'}" aria-hidden="true">${K[q.kind].g}</span><span lang="${lang}" dir="${lang==='ar'?'rtl':'ltr'}">${txt}</span></span></button>`;
      }).join('')}</div>
    </div>`).join('');
}

// pop-up bubble
const pop = document.getElementById('pop'), $ = id => document.getElementById(id);
let opener = null;
// base direction from majority script by words, so Arabic-led code-switch reads RTL
const dirOf = s => (s.match(/[؀-ۿ]+/g)||[]).length >= (s.match(/[A-Za-z]+/g)||[]).length ? 'rtl' : 'ltr';
function open(btn){
  const q = Q[btn.dataset.id], k = K[q.kind], p = PEOPLE.find(x => x.name === btn.dataset.who);
  opener = btn; pop.dir = lang==='ar'?'rtl':'ltr';
  pop.style.setProperty('--h', p.h);
  $('pk').className = `k k-${q.kind}`; $('pk').innerHTML = k.g; $('pk').dir = lang==='ar'?'rtl':'ltr';
  $('pkind').textContent = k[lang]; $('pkind').lang = lang;
  $('pwho').textContent = `${btn.dataset.who} · ${q.t}`;
  $('ptx').textContent = q[lang]; $('ptx').lang = lang; $('ptx').dir = lang==='ar'?'rtl':'ltr';
  $('pq').textContent = q.orig; $('pq').dir = dirOf(q.orig); $('pl').textContent = UI[lang].orig; $('pl').lang = lang; $('pl').dir = lang==='ar'?'rtl':'ltr';
  $('pa').textContent = UI[lang].open; $('pa').lang = lang;
  pop.hidden = false;
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  const left = Math.max(16, Math.min(r.left, innerWidth - w - 16));
  const up = r.bottom + 12 + h > innerHeight - 8 && r.top - 12 - h > 8;
  pop.classList.toggle('up', up);
  pop.style.left = left + 'px';
  pop.style.top = (up ? r.top - 12 - h : r.bottom + 12) + 'px';
  pop.style.setProperty('--tx', Math.max(14, Math.min(r.left + 16 - left, w - 24)) + 'px');
  $('px').focus();
}
function close(){ if (pop.hidden) return; pop.hidden = true; opener && opener.focus(); }
grid.addEventListener('click', e => { const b = e.target.closest('.b'); if (b) { e.stopPropagation(); open(b); } });
$('px').onclick = close;
$('pa').onclick = e => e.preventDefault(); // ponytail: notes view is out of scope for a look draft
document.addEventListener('click', e => { if (!pop.contains(e.target)) close(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
addEventListener('resize', close); addEventListener('scroll', close, true);

document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  lang = b.dataset.l;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  close(); render();
});

// contrast check, worst case = pure white backdrop (blur/saturate/brightness(.85) only darken it):
// smoke base over white, then each aurora gradient stop over that; white text and the .9 idle name must stay >= 4.5:1
function lum(c){ return c.map(v => (v/=255) <= .04045 ? v/12.92 : ((v+.055)/1.055)**2.4).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0); }
const over = (fg,a,bg) => fg.map((c,i)=>c*a+bg[i]*(1-a));
const ratio = (a,b) => { const [x,y]=[lum(a),lum(b)].sort((m,n)=>n-m); return (x+.05)/(y+.05); };
const hsl = (h,s,l) => { h=((h%360)+360)%360; s/=100; l/=100; const f=n=>{const k=(n+h/30)%12; return 255*(l-s*Math.min(l,1-l)*Math.max(-1,Math.min(k-3,9-k,1)));}; return [f(0),f(8),f(4)]; };
const WHITE = [255,255,255];
let worst = 99;
// [tint, base, text alpha]: speaking name, idle name, bubble, pop-up
for (const p of PEOPLE) for (const [tint,base,ta] of [[.34,.66,1],[.2,.66,.9],[.26,.66,1],[.22,.74,1]]) {
  const body = over([12,14,18], base, WHITE);
  for (const [dh,a] of [[0,tint],[40,.14],[-30,.2]]) {
    const g = over(hsl(p.h+dh,70,42), a, body);
    worst = Math.min(worst, ratio(over(WHITE,ta,g), g));
  }
}
console.assert(worst >= 4.5, 'contrast below AA', worst);
$('cr').textContent = `Worst case over pure white: ${worst.toFixed(1)}:1`;

render();
</script>
</body>
</html>
