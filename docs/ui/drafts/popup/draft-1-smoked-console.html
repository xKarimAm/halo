<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popup draft 1: Smoked console</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Draft 1: the whole popup is Mix B smoked glass. An aurora wash sits behind
   (the popup has nothing under it, so the wash is what the glass frosts). */
:root{
  --base:.66; --blur:blur(16px) saturate(140%) brightness(.85);
  --ink:#fff; --ink-2:rgba(255,255,255,.78); --ink-3:rgba(255,255,255,.55); --dark:#0b0f1a;
  --h:285; /* Halo's own aurora hue (the self tile's) */
  --k-point:#8ecbf5; --k-question:#c3a8ff; --k-decision:#7fdcc0; --k-pushback:#ffb199;
}
*{box-sizing:border-box}
html,body{margin:0}
body{width:360px;min-height:100vh;color:var(--ink);font:500 12.5px/1.35 'Inter',system-ui,sans-serif;letter-spacing:-.01em;
  background:
    radial-gradient(220px 180px at 12% 4%,hsl(285 70% 45% / .55),transparent 70%),
    radial-gradient(240px 200px at 100% 38%,hsl(190 70% 40% / .45),transparent 70%),
    radial-gradient(260px 220px at 20% 100%,hsl(150 60% 36% / .40),transparent 70%),
    #101217}
.gl{background:linear-gradient(120deg,hsl(var(--h) 70% 42% / .18),hsl(calc(var(--h) + 40) 70% 42% / .10) 55%,hsl(calc(var(--h) - 30) 70% 42% / .14)),rgb(12 14 18 / var(--base));
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid hsl(var(--h) 85% 86% / .32)}
.wrap{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;gap:10px}
.word{font:600 17px/1 'Inter',sans-serif;padding:6px 12px;border-radius:999px;border-color:hsl(var(--h) 90% 86% / .9);
  box-shadow:0 0 14px hsl(var(--h) 90% 60% / .5);text-shadow:0 0 6px hsl(var(--h) 95% 72% / .9)}
.chip{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);padding:4px 9px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--k-decision);box-shadow:0 0 0 1.5px var(--dark)}
.card{border-radius:14px;padding:10px 12px}
.row{display:flex;gap:6px;align-items:center}
label,.lbl{display:block;font-size:11px;color:var(--ink-3);margin:0 0 4px;text-transform:uppercase;letter-spacing:.06em}
.f+.f{margin-top:6px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:rgb(0 0 0 / .35);border:1px solid rgb(255 255 255 / .16);border-radius:9px;padding:7px 9px}
textarea{resize:none;height:40px}
input::placeholder{color:var(--ink-3)}
input:focus,textarea:focus,select:focus{outline:none;border-color:hsl(var(--h) 90% 80%)}
.person{display:grid;grid-template-columns:22px 1fr 1fr;gap:6px;align-items:center}
.person+.person{margin-top:6px}
.k{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--dark);box-shadow:0 0 0 1.5px var(--dark)}
.btn{font:600 12.5px/1 'Inter',sans-serif;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--ink);background:rgb(255 255 255 / .08);border:1px solid rgb(255 255 255 / .28)}
.seg{display:inline-flex;border:1px solid rgb(255 255 255 / .35);border-radius:999px;overflow:hidden}
.seg span{padding:4px 11px;font-size:11.5px;color:var(--ink-2)} .seg .on{background:#fff;color:#111}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.start{width:100%;padding:13px;border-radius:999px;font:600 15px/1 'Inter',sans-serif;color:#fff;cursor:pointer;
  border:1px solid hsl(var(--h) 90% 86% / .9);box-shadow:0 0 18px hsl(var(--h) 90% 60% / .45)}
.foot{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)}
</style></head><body><div class="wrap">
<header><span class="word gl">Halo</span><span class="chip gl"><span class="dot"></span>Paired</span></header>

<section class="card gl"><span class="lbl">Pair with Halo app</span>
  <div class="row"><input placeholder="6-digit code" inputmode="numeric"><button class="btn">Pair</button></div></section>

<section class="card gl">
  <div class="f"><label>Subject</label><input value="Checkout v2: launch readiness"></div>
  <div class="f"><label>Agenda, one per line</label><textarea>Launch date
Payments QA owner</textarea></div>
  <div class="f"><span class="lbl">People and roles</span>
    <div class="person"><span class="k" style="background:hsl(285 70% 78%)">L</span><input value="Layla"><input value="Product lead"></div>
    <div class="person"><span class="k" style="background:hsl(190 70% 72%)">O</span><input value="Omar"><input placeholder="Role (optional)"></div></div>
  <div class="f two"><div><label>My points in</label><select><option>English</option><option>Arabic</option></select></div>
    <div><label>Project</label><input placeholder="Optional"></div></div>
  <div class="f row" style="justify-content:space-between"><span style="font-size:11.5px;color:var(--ink-2)">Saved</span><button class="btn">Save</button></div>
</section>

<section class="card gl row" style="justify-content:space-between"><span class="lbl" style="margin:0">Urgency marks</span>
  <span class="seg"><span>Words</span><span class="on">Symbols</span></span></section>

<button class="start gl">Start</button>
<div class="foot"><span><span class="dot" style="display:inline-block;margin-inline-end:6px"></span>Microphone: ready</span><span>Build 0.1.0 (5e4445b)</span></div>
</div></body></html>
