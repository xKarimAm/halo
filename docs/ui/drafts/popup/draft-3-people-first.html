<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popup draft 3: People first</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Draft 3: the Notes page's "People First" layout in a popup. The people in
   the call lead (big avatars, role under each), the meeting brief follows.
   Sage & Clay tokens (notes-v2.html?palette=2). */
:root{
  --r:22px; --blur:blur(20px) saturate(115%);
  --bg:#e9e4da; --text:#2a2924; --muted:#57544b; --faint:#625e55; --on-accent:#fbf8f1;
  --glass:rgba(255,252,246,.55); --glass-hi:rgba(255,252,246,.85);
  --rim:#d0cabf; --hair:#dbd5cb; --dec:#3b6343; --q:#3d6079;
  --focus:#3d6079; --logo-dot:#5f7f62; --sh-glass:inset 0 1px 0 rgba(255,255,255,.75);
  --sh-logo:0 0 10px 2px rgba(95,127,98,.30); --glow-a:.22;
}
*{box-sizing:border-box} html,body{margin:0}
body{width:360px;min-height:100vh;color:var(--text);font:400 13px/1.4 'Inter',system-ui,sans-serif;
  background:radial-gradient(300px 200px at 50% 0%,rgba(127,154,120,.40),transparent 75%),var(--bg)}
.wrap{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px}
header{display:flex;align-items:center;gap:8px}
.logo{width:9px;height:9px;border-radius:50%;background:var(--logo-dot);box-shadow:var(--sh-logo)}
h1{margin:0;font:700 15px/1 'Inter',sans-serif;letter-spacing:-.02em}
.code{margin-inline-start:auto;display:flex;gap:6px}
.code input{width:104px;padding:6px 9px;font-size:12px}
.people{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 2px}
.person{flex:0 0 96px;display:flex;flex-direction:column;align-items:center;gap:6px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;color:var(--on-accent);
  background:hsl(var(--h) 27% 33%);box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px hsl(var(--h) 40% 55%),0 0 16px hsl(var(--h) 55% 55% / var(--glow-a))}
.person input{text-align:center;padding:5px 6px;font-size:12px}
.person .nm{font-weight:600}
.add{flex:0 0 56px;height:56px;border-radius:50%;border:1.5px dashed var(--rim);display:grid;place-items:center;color:var(--muted);font-size:22px}
.card{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--rim);border-radius:var(--r);box-shadow:var(--sh-glass);padding:12px 14px}
.lbl{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:0 0 5px}
.f+.f{margin-top:7px}
input,textarea,select{width:100%;font:inherit;color:var(--text);background:var(--glass-hi);border:1px solid var(--hair);border-radius:12px;padding:6px 10px}
textarea{resize:none;height:40px}
input::placeholder{color:var(--faint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font:600 12.5px/1 'Inter',sans-serif;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--text);background:var(--glass-hi);border:1px solid var(--rim)}
.row{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:rgba(74,64,48,.10);border-radius:999px;padding:3px}
.seg span{padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted);border-radius:999px} .seg .on{background:var(--glass-hi);color:var(--text)}
.bar{display:flex;align-items:center;gap:10px}
.start{flex:1;padding:14px;border-radius:999px;border:0;font:700 15px/1 'Inter',sans-serif;color:var(--on-accent);background:var(--dec);cursor:pointer}
.mic{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.mic i{width:8px;height:8px;border-radius:50%;background:var(--dec)}
.foot{font-size:11px;color:var(--faint);text-align:center}
</style></head><body><div class="wrap">
<header><span class="logo"></span><h1>Halo</h1>
  <span class="code"><input placeholder="Pair code" inputmode="numeric"><button class="btn">Pair</button></span></header>
<div style="font-size:11.5px;color:var(--dec);font-weight:600;margin-top:-6px">Paired with the Halo app</div>

<section><span class="lbl">Who is in the call</span>
<div class="people">
  <div class="person" style="--h:285"><span class="av">L</span><input class="nm" value="Layla"><input value="Product lead"></div>
  <div class="person" style="--h:190"><span class="av">O</span><input class="nm" value="Omar"><input placeholder="Role"></div>
  <div class="person" style="--h:20"><span class="av">S</span><input class="nm" value="Sarah"><input value="Payments"></div>
</div></section>

<section class="card">
  <div class="f"><span class="lbl">Subject</span><input value="Checkout v2: launch readiness"></div>
  <div class="f"><span class="lbl">Agenda <span style="font-weight:400">(one item per line)</span></span><textarea>Launch date
Payments QA owner</textarea></div>
  <div class="f two"><div><span class="lbl">My points language</span><select><option>English</option><option>Arabic</option></select></div>
    <div><span class="lbl">Project</span><input placeholder="Optional"></div></div>
  <div class="f row"><span class="lbl" style="margin:0">Urgency marks</span><span class="seg" style="margin-inline-start:auto"><span class="on">Words</span><span>Symbols</span></span></div>
  <div class="f row" style="justify-content:flex-end"><span style="color:var(--dec);font-weight:600;margin-inline-end:auto">Saved</span><button class="btn">Save</button></div>
</section>

<div class="bar"><button class="start">Start</button><span class="mic"><i></i>Mic ready</span></div>
<div class="foot">Build 0.1.0 (5e4445b)</div>
</div></body></html>
