<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popup draft 4: Glass tabs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Draft 4: Mix B smoked glass, but quiet: three tabs (Meeting, People,
   Settings) keep the popup short, and Start is always in view at the bottom.
   Tabs switch with plain radio inputs (no script). */
:root{
  --base:.7; --blur:blur(16px) saturate(140%) brightness(.85);
  --ink:#fff; --ink-2:rgba(255,255,255,.8); --ink-3:rgba(255,255,255,.55); --dark:#0b0f1a; --h:190;
  --k-point:#8ecbf5; --k-question:#c3a8ff; --k-decision:#7fdcc0; --k-pushback:#ffb199;
}
*{box-sizing:border-box} html,body{margin:0}
body{width:360px;height:480px;color:var(--ink);font:500 12.5px/1.35 'Inter',system-ui,sans-serif;letter-spacing:-.01em;
  background:radial-gradient(280px 200px at 90% 0%,hsl(190 70% 40% / .55),transparent 70%),radial-gradient(260px 240px at 0% 100%,hsl(285 60% 40% / .45),transparent 70%),#0e1014;
  display:flex;flex-direction:column}
.gl{background:linear-gradient(120deg,hsl(var(--h) 70% 42% / .16),hsl(calc(var(--h) + 40) 70% 42% / .08) 55%,hsl(calc(var(--h) - 30) 70% 42% / .12)),rgb(12 14 18 / var(--base));
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid hsl(var(--h) 85% 86% / .28)}
header{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
h1{margin:0;font:600 16px/1 'Inter',sans-serif}
.st{margin-inline-start:auto;display:flex;gap:6px}
.st span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);padding:3px 8px;border-radius:999px}
.k{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1.5px var(--dark);background:var(--k-decision)}
.tabs{display:flex;margin:0 14px;border-radius:999px;padding:3px}
.tabs label{flex:1;text-align:center;padding:6px 0;border-radius:999px;color:var(--ink-2);cursor:pointer;font-size:12px}
input[type=radio]{position:absolute;opacity:0;pointer-events:none}
#t1:checked~.tabs [for=t1],#t2:checked~.tabs [for=t2],#t3:checked~.tabs [for=t3]{background:#fff;color:#111}
.panes{flex:1;overflow:auto;padding:12px 14px}
.pane{display:none} #t1:checked~.panes .p1,#t2:checked~.panes .p2,#t3:checked~.panes .p3{display:block}
.lbl{display:block;font-size:11px;color:var(--ink-3);margin:0 0 4px}
.f+.f{margin-top:10px}
input:not([type=radio]),textarea,select{width:100%;font:inherit;color:var(--ink);background:rgb(0 0 0 / .35);border:1px solid rgb(255 255 255 / .16);border-radius:9px;padding:8px 9px}
textarea{resize:none;height:70px}
input::placeholder{color:var(--ink-3)}
.person{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;border-radius:12px;border-inline-start:3px solid hsl(var(--h) 80% 72%)}
.person+.person{margin-top:8px}
.row{display:flex;gap:8px;align-items:center}
.btn{font:600 12px/1 'Inter',sans-serif;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--ink);background:rgb(255 255 255 / .08);border:1px solid rgb(255 255 255 / .28)}
.seg{display:inline-flex;border:1px solid rgb(255 255 255 / .35);border-radius:999px;overflow:hidden}
.seg span{padding:4px 11px;font-size:11.5px;color:var(--ink-2)} .seg .on{background:#fff;color:#111}
footer{padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px}
.start{width:100%;padding:12px;border-radius:999px;font:600 15px/1 'Inter',sans-serif;color:#fff;cursor:pointer;border:1px solid hsl(var(--h) 90% 86% / .85);box-shadow:0 0 16px hsl(var(--h) 90% 60% / .4)}
.foot{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)}
</style></head><body>
<header><h1>Halo</h1><span class="st"><span class="gl"><i class="k"></i>Paired</span><span class="gl"><i class="k"></i>Mic ready</span></span></header>
<input type="radio" name="t" id="t1" checked><input type="radio" name="t" id="t2"><input type="radio" name="t" id="t3">
<nav class="tabs gl"><label for="t1">Meeting</label><label for="t2">People</label><label for="t3">Settings</label></nav>
<div class="panes">
  <div class="pane p1">
    <div class="f"><span class="lbl">Subject</span><input value="Checkout v2: launch readiness"></div>
    <div class="f"><span class="lbl">Agenda (one item per line)</span><textarea>Launch date
Payments QA owner</textarea></div>
    <div class="f"><span class="lbl">Project (optional)</span><input placeholder="Optional"></div>
    <div class="f row" style="justify-content:flex-end"><span style="color:var(--ink-2);margin-inline-end:auto">Saved</span><button class="btn">Save</button></div>
  </div>
  <div class="pane p2">
    <div class="person gl" style="--h:285"><input value="Layla"><input value="Product lead"></div>
    <div class="person gl" style="--h:190"><input value="Omar"><input placeholder="Role (optional)"></div>
  </div>
  <div class="pane p3">
    <div class="f"><span class="lbl">Pair with the Halo app</span><div class="row"><input placeholder="6-digit code"><button class="btn">Pair</button></div></div>
    <div class="f"><span class="lbl">My points language</span><select><option>English</option><option>Arabic</option></select></div>
    <div class="f row"><span class="lbl" style="margin:0">Urgency marks</span><span class="seg" style="margin-inline-start:auto"><span>Words</span><span class="on">Symbols</span></span></div>
  </div>
</div>
<footer><button class="start gl">Start</button><div class="foot"><span>Saved</span><span>Build 0.1.0 (5e4445b)</span></div></footer>
</body></html>
