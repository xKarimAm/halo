<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popup draft 5: Glass band</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Draft 5: both looks in one. A Mix B smoked-glass band on top (the glowing
   name, pair state, mic, Start), the Notes page's Sage & Clay paper below for
   the meeting brief. Start sits in the dark band, so it is the first thing seen. */
:root{
  --base:.66; --gblur:blur(16px) saturate(140%) brightness(.85); --h:150; --dark:#0b0f1a;
  --k-decision:#7fdcc0; --k-pushback:#ffb199;
  --r:18px; --blur:blur(20px) saturate(115%);
  --bg:#e9e4da; --text:#2a2924; --muted:#57544b; --faint:#625e55;
  --glass:rgba(255,252,246,.55); --glass-hi:rgba(255,252,246,.85); --rim:#d0cabf; --hair:#dbd5cb; --dec:#3b6343;
  --focus:#3d6079; --sh-glass:inset 0 1px 0 rgba(255,255,255,.75);
}
*{box-sizing:border-box} html,body{margin:0}
body{width:360px;color:var(--text);font:400 13px/1.4 'Inter',system-ui,sans-serif;background:var(--bg)}
.band{position:relative;padding:14px 14px 16px;color:#fff;border-radius:0 0 22px 22px;overflow:hidden;
  background:radial-gradient(240px 180px at 10% 0%,hsl(285 70% 45% / .6),transparent 70%),radial-gradient(240px 200px at 100% 100%,hsl(150 60% 38% / .55),transparent 70%),#111318}
.gl{background:linear-gradient(120deg,hsl(var(--h) 70% 42% / .2),hsl(calc(var(--h) + 40) 70% 42% / .1) 55%,hsl(calc(var(--h) - 30) 70% 42% / .16)),rgb(12 14 18 / var(--base));
  -webkit-backdrop-filter:var(--gblur);backdrop-filter:var(--gblur);border:1px solid hsl(var(--h) 85% 86% / .32);color:#fff}
.top{display:flex;align-items:center;gap:8px}
.word{font:600 16px/1 'Inter',sans-serif;padding:6px 12px;border-radius:999px;border-color:hsl(var(--h) 90% 86% / .9);box-shadow:0 0 14px hsl(var(--h) 90% 60% / .5);text-shadow:0 0 6px hsl(var(--h) 95% 72% / .9)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 9px;border-radius:999px;color:rgba(255,255,255,.85)}
.chip:first-of-type{margin-inline-start:auto}
.k{width:10px;height:10px;border-radius:50%;background:var(--k-decision);box-shadow:0 0 0 1.5px var(--dark)}
.pair{display:flex;gap:6px;margin-top:12px}
.pair input{background:rgb(0 0 0 / .35);border:1px solid rgb(255 255 255 / .18);color:#fff}
.pair input::placeholder{color:rgba(255,255,255,.55)}
.gbtn{font:600 12.5px/1 'Inter',sans-serif;border-radius:999px;padding:8px 14px;cursor:pointer}
.start{width:100%;margin-top:10px;padding:13px;border-radius:999px;font:600 15px/1 'Inter',sans-serif;cursor:pointer;border-color:hsl(var(--h) 90% 86% / .9);box-shadow:0 0 18px hsl(var(--h) 90% 60% / .45)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--rim);border-radius:var(--r);box-shadow:var(--sh-glass);padding:12px}
.lbl{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:0 0 5px}
.f+.f{margin-top:7px}
input,textarea,select{width:100%;font:inherit;color:var(--text);background:var(--glass-hi);border:1px solid var(--hair);border-radius:11px;padding:7px 10px}
textarea{resize:none;height:40px}
.person{display:grid;grid-template-columns:24px 1fr 1fr;gap:6px;align-items:center}
.person+.person{margin-top:6px}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:10.5px;color:#fbf8f1;background:hsl(var(--h) 27% 33%)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.btn{font:600 12.5px/1 'Inter',sans-serif;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--text);background:var(--glass-hi);border:1px solid var(--rim)}
.seg{display:inline-flex;background:rgba(74,64,48,.10);border-radius:999px;padding:3px}
.seg span{padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted);border-radius:999px} .seg .on{background:var(--glass-hi);color:var(--text)}
.foot{font-size:11px;color:var(--faint);text-align:end}
</style></head><body>
<section class="band">
  <div class="top"><span class="word gl">Halo</span><span class="chip gl"><i class="k"></i>Paired</span><span class="chip gl"><i class="k"></i>Mic ready</span></div>
  <div class="pair"><input placeholder="6-digit pair code" inputmode="numeric"><button class="gbtn gl">Pair</button></div>
  <button class="start gl">Start</button>
</section>
<div class="body">
<section class="card">
  <div class="f"><span class="lbl">Subject</span><input value="Checkout v2: launch readiness"></div>
  <div class="f"><span class="lbl">Agenda <span style="font-weight:400">(one item per line)</span></span><textarea>Launch date
Payments QA owner</textarea></div>
  <div class="f"><span class="lbl">People and roles</span>
    <div class="person"><span class="av" style="--h:285">L</span><input value="Layla"><input value="Product lead"></div>
    <div class="person"><span class="av" style="--h:190">O</span><input value="Omar"><input placeholder="Role (optional)"></div></div>
  <div class="f two"><div><span class="lbl">My points language</span><select><option>English</option><option>Arabic</option></select></div>
    <div><span class="lbl">Project</span><input placeholder="Optional"></div></div>
  <div class="f row"><span style="color:var(--dec);font-weight:600;margin-inline-end:auto">Saved</span><button class="btn">Save</button></div>
</section>
<section class="card row" style="padding:9px 12px"><span class="lbl" style="margin:0">Urgency marks</span><span class="seg" style="margin-inline-start:auto"><span class="on">Words</span><span>Symbols</span></span></section>
<div class="foot">Build 0.1.0 (5e4445b)</div>
</div>
</body></html>
