<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Halo microphone permission</title>
  </head>
  <body>
    <div id="halo-mic">
      <h1>Halo microphone</h1>
      <p>The offscreen hub cannot show a permission prompt, so grant the
      microphone here once. Halo keeps the grant and captures your mic
      (stream 1) alongside the call audio from the next Start.</p>
      <button id="allow-mic" type="button">Allow microphone</button>
      <p id="mic-permission-state"></p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
